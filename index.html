<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#334155">
<title>인계장</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="인계장">
<style>
  :root{
    --ink:#000;
    --line:0.5pt solid #000;
    --guide:#e2e8f0;
    --ph:#cbd5e1;
    --po:#4ade80; --inj:#60a5fa; --etc:#facc15;   /* 약 경로: 경구 / 주사 / 기타 */
    --warn:#c2410c;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:#f1f5f9;
    font-family:'맑은 고딕','Malgun Gothic','Apple SD Gothic Neo',sans-serif;
    color:#0f172a;
    -webkit-text-size-adjust:100%;
  }

  /* ───────── 툴바 ───────── */
  .bar{
    position:sticky; top:0; z-index:20;
    background:#334155; color:#fff;
    padding:8px 10px;
    display:flex; flex-wrap:wrap; gap:6px; align-items:center;
    box-shadow:0 1px 4px rgba(0,0,0,.25);
  }
  .bar b{font-size:14px; margin-right:4px; letter-spacing:.5px}
  .bar button{
    font:inherit; font-size:13px;
    background:#475569; color:#fff; border:0; border-radius:6px;
    padding:6px 10px; cursor:pointer; white-space:nowrap;
  }
  .bar button:hover{background:#64748b}
  .bar button.primary{background:#0ea5e9}
  .bar button.primary:hover{background:#38bdf8}
  .bar button.danger{background:#9f1239}
  .bar button.danger:hover{background:#be123c}
  .cnt{display:flex; align-items:center; gap:4px; background:#475569; border-radius:6px; padding:2px 4px}
  .cnt button{padding:3px 9px; background:transparent; font-size:15px; line-height:1}
  .cnt span{font-size:13px; min-width:56px; text-align:center}
  .sp{flex:1}
  .hint{font-size:11px; color:#cbd5e1; width:100%; margin-top:2px}
  .hint a{color:#cbd5e1}

  /* ───────── 연동 패널 ───────── */
  .sync{display:none; background:#1e293b; color:#e2e8f0; padding:10px; gap:8px; flex-direction:column}
  .sync.open{display:flex}
  .sync .row{display:flex; gap:6px; align-items:center; flex-wrap:wrap}
  .sync label{font-size:12px; color:#94a3b8; width:100%}
  .sync textarea{
    width:100%; height:58px; resize:vertical;
    font-family:ui-monospace,Menlo,Consolas,monospace; font-size:11px;
    border-radius:6px; border:1px solid #475569; background:#0f172a; color:#e2e8f0; padding:6px;
  }
  .sync button{
    font:inherit; font-size:12px; background:#475569; color:#fff;
    border:0; border-radius:6px; padding:5px 10px; cursor:pointer;
  }
  .sync button:hover{background:#64748b}

  /* ───────── 전체 인계장 (A4, 자동 요약) ───────── */
  .stage{padding:14px; display:flex; justify-content:center}
  .sheet{width:17cm; background:#fff; box-shadow:0 2px 12px rgba(15,23,42,.18); transform-origin:top center}
  table.form{width:16.76cm; margin:0 auto; border-collapse:collapse; table-layout:fixed}   /* 17cm→16.76: 인쇄 우측 잘림 방지 */
  table.form td{padding:0; border:var(--line); vertical-align:top; overflow:hidden; color:var(--ink)}
  @media screen{
    #rows tr:hover td{background:#f8fafc; cursor:pointer}
    #rows tr.drop-target td{background:#e0f2fe}
  }

  /* 이름 칸 */
  td.c-name{position:relative}
  .nmbox{display:flex; flex-direction:column; justify-content:center; height:100%; padding:1px 3px 1px 12px; gap:1px}
  .nm-top{display:flex; justify-content:space-between; align-items:baseline; font-size:7pt; white-space:nowrap; gap:2px}
  .nm-top .bed{font-family:ui-monospace,Menlo,Consolas,monospace}
  .nm-top .dc.big b{font-size:1.2em}
  .nm-name{font-size:10.5pt; font-weight:700; text-align:center; white-space:nowrap; overflow:hidden}
  .nm-name.struck{text-decoration:line-through}
  .nm-sub{font-size:7pt; text-align:center; white-space:nowrap; overflow:hidden}
  .ph{color:var(--ph); font-weight:400}
  .dcslash{position:absolute; left:0; top:0; width:100%; height:100%; pointer-events:none; display:none; z-index:1}
  .dcslash line{stroke:#dc2626; stroke-width:1; vector-effect:non-scaling-stroke}
  td.c-name.dctoday .dcslash{display:block}
  .draghandle{
    position:absolute; left:0; top:0; bottom:0; z-index:6; width:11px;
    display:flex; align-items:center; justify-content:center;
    font-size:11px; line-height:1; color:#94a3b8; cursor:grab; user-select:none; touch-action:none;
  }
  .draghandle:hover{color:#0ea5e9}
  body.dragging, body.dragging *{cursor:grabbing !important; user-select:none}

  /* 요약 칸: 3줄 (진단 / 태그 / 체크 토글 + V/S 손글씨) */
  .sumbox{display:flex; flex-direction:column; height:100%; padding:1px 3px}
  .ln{flex:1; display:flex; align-items:center; gap:3px; white-space:nowrap; overflow:hidden; min-height:0}
  .ln1{font-size:9pt; font-weight:600}
  .ln1 small{font-weight:400; font-size:.85em}
  .ln2{font-size:7.5pt; flex:1.4; flex-wrap:wrap; align-content:center; row-gap:1px; white-space:normal}   /* 태그 많으면 2줄 */
  .ln2 > *{white-space:nowrap}
  .ln3{font-size:8pt}
  .t{border:0.5pt solid #333; border-radius:2px; padding:0 2px; line-height:1.25}
  .t.hi{background:#111; color:#fff; border-color:#111; font-weight:700}
  .medc{font-weight:700; padding:0 2px; border-radius:2px; line-height:1.25}
  .m1{background:var(--po)} .m2{background:var(--inj)} .m3{background:var(--etc)}
  .tgs{font-weight:600}
  .vstpl{white-space:nowrap; color:var(--ink); margin-left:auto}
  .vsl{display:inline-block; min-width:0.55cm; text-align:center}
  .vsl i{font-style:normal; font-size:5.5pt; color:#c3ccd8}
  .vsl.hl{background:#fde047; border-radius:1px}        /* 개별탭에서 체크한 V/S = 형광펜 */
  .vsl.hl i{color:#a16207}
  .vsq{color:#dc2626; font-weight:700; margin-right:3px}  /* q8hr 아닐 때만 */

  /* 할 일 칸: 가로 흐름, 남는 아래 공간은 근무 중 손글씨 */
  .todobox{display:flex; flex-wrap:wrap; align-content:flex-start; gap:0 6px; padding:1px 3px; height:100%; font-size:8pt; line-height:1.3; overflow:hidden}
  .ti{white-space:nowrap}
  .ti.done{color:#64748b}
  .ti .ck{margin-left:2px}
  .ti b{font-weight:700}

  /* ───────── 개별 인계장 (입력) ───────── */
  .pvtoggle{display:flex; justify-content:center; padding:6px 14px 28px}
  .pvtoggle button{font:inherit; font-size:15px; background:#334155; color:#fff; border:0; border-radius:10px; padding:12px 22px; cursor:pointer}
  .pvtoggle button:hover{background:#475569}
  .ed{display:none; max-width:620px; margin:0 auto; padding:12px 12px 0}
  body.pv .ed{display:block}
  body.pv .pvtoggle.sheetonly{display:none}
  /* 전체 인계장은 지우지 않고 화면 밖으로만 → 크기 측정이 계속 정상 */
  body.pv .stage{position:absolute; left:-10000px; top:0; visibility:hidden}

  .ed-nav{display:flex; gap:6px; overflow-x:auto; padding:0 0 10px; -webkit-overflow-scrolling:touch}
  .ed-nav button{flex:0 0 auto; font:inherit; font-size:14px; border:1px solid #cbd5e1; background:#fff; color:#0f172a; border-radius:999px; padding:6px 12px; cursor:pointer; white-space:nowrap}
  .ed-nav button.cur{background:#0ea5e9; border-color:#0ea5e9; color:#fff}
  .ed-nav button.dc2{text-decoration:line-through}
  .ed-nav button.add{border-style:dashed; color:#0369a1}
  .card{background:#fff; border-radius:12px; box-shadow:0 2px 10px rgba(15,23,42,.12); padding:12px 14px; font-size:15px; line-height:1.45}
  .card input, .card textarea{
    font:inherit; font-size:15px; color:#0f172a; background:transparent;
    border:0; border-bottom:1px solid #e2e8f0; border-radius:0; padding:4px 2px; width:100%; min-width:0; outline:0;
  }
  .card input:focus, .card textarea:focus{border-bottom-color:#0ea5e9; background:#f0f9ff}
  .card input:disabled{color:#cbd5e1}
  .card textarea{resize:none; overflow:hidden; line-height:1.4; display:block}
  .card ::placeholder{color:#cbd5e1}
  .hdr{display:grid; grid-template-columns:4.6em minmax(0,1fr); gap:4px 10px; align-items:end; padding-bottom:8px}
  .hdr .nm{font-size:20px; font-weight:700}
  .hdr .bed{font-family:ui-monospace,Menlo,Consolas,monospace}
  .row3{display:grid; grid-template-columns:4.6em auto minmax(0,1fr); gap:10px; align-items:center; grid-column:1/-1}
  .seg{display:inline-flex; border:1px solid #cbd5e1; border-radius:8px; overflow:hidden; flex:0 0 auto}
  .seg button{font:inherit; font-size:13px; border:0; background:#fff; color:#475569; padding:5px 10px; cursor:pointer; white-space:nowrap}
  .seg button + button{border-left:1px solid #cbd5e1}
  .seg button.on{background:#0ea5e9; color:#fff}
  .sec{display:grid; grid-template-columns:3.4em minmax(0,1fr); gap:10px; padding:8px 0; border-top:1px dashed #e2e8f0}
  .sec > .k{color:#64748b; font-size:13px; padding-top:6px}
  .sec > .v{min-width:0; display:flex; flex-direction:column; gap:4px}
  .pair{display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr); gap:10px}
  @media (max-width:420px){ .pair.stack{grid-template-columns:minmax(0,1fr)} }
  .lbl{display:flex; align-items:center; gap:6px; min-width:0}
  .lbl > span{flex:0 0 auto; font-size:12px; color:#64748b; white-space:nowrap}
  .calc{flex:0 0 auto; font-size:13px; font-weight:700; color:#0f172a; white-space:nowrap}
  .calc.due{color:var(--warn)}
  .chips{display:flex; flex-wrap:wrap; gap:5px}
  .chip{font:inherit; font-size:13px; border:1px solid #cbd5e1; background:#fff; color:#94a3b8; border-radius:6px; padding:3px 9px; cursor:pointer; user-select:none}
  .chip.on{border-color:#0f172a; color:#0f172a; font-weight:700}
  .chip.on.hi{background:#0f172a; color:#fff}
  .chip.q{color:#0f172a; border-color:#0f172a}
  .chip.q.alt{background:#dc2626; border-color:#dc2626; color:#fff; font-weight:700}
  .gap{width:8px}
  .li{display:grid; gap:6px; align-items:center}
  /* 라인·튜브: 종류마다 사정 항목이 다른 작은 카드 */
  .lcard{border:1px solid #e2e8f0; border-radius:8px; padding:6px 8px; display:flex; flex-direction:column; gap:4px}
  .lc-top{display:flex; align-items:center; gap:8px}
  .lc-type{font-weight:700; font-size:14px; white-space:nowrap}
  .lc-top input.lc-name{flex:1; font-weight:700}
  .lc-top .lc-date{width:5.5em; flex:0 0 auto}
  .lc-top .x{margin-left:auto}
  .lc-fields{display:flex; flex-wrap:wrap; gap:4px 12px; align-items:center}
  .lf{display:flex; align-items:center; gap:4px; min-width:0}
  .lf > span{font-size:12px; color:#64748b; white-space:nowrap}
  .card .lf input{width:4.2em}
  .card .lf input.w{width:8em}
  .seg.sm button{font-size:12px; padding:2px 8px}
  .lpick{display:flex; flex-wrap:wrap; gap:5px}
  .lpick .chip{color:#0f172a}
  .li.todo{grid-template-columns:1.6em minmax(0,1fr) 1.4em}
  .li.cons{grid-template-columns:minmax(0,5em) auto minmax(0,1fr) 1.4em}
  .x{border:0; background:transparent; color:#94a3b8; font-size:20px; cursor:pointer; padding:0; line-height:1}
  .x:hover{color:#dc2626}
  .li .x{border:0; background:transparent; color:#94a3b8; font-size:20px; cursor:pointer; padding:0; line-height:1}
  .li .x:hover{color:#dc2626}
  .li .cb{border:1.5px solid #64748b; border-radius:4px; width:1.3em; height:1.3em; background:#fff; cursor:pointer; padding:0; font-size:13px; line-height:1; color:transparent}
  .li .cb.on{background:#0f172a; border-color:#0f172a; color:#fff}
  .li.todo.done input{color:#94a3b8; text-decoration:line-through}
  .addbtn{align-self:flex-start; font:inherit; font-size:13px; border:1px dashed #94a3b8; background:#fff; color:#0369a1; border-radius:6px; padding:3px 10px; cursor:pointer}
  .mzone{display:flex; flex-wrap:wrap; gap:4px; align-items:center}
  .medl{display:inline-block; font-size:15px; min-width:1.9em; text-align:center; padding:3px 6px; border-radius:5px; border:1px solid #cbd5e1;
    font-weight:700; color:#cbd5e1; cursor:pointer; user-select:none; -webkit-user-select:none; -webkit-touch-callout:none; touch-action:manipulation}
  .medl.m1,.medl.m2,.medl.m3{color:#0f172a; border-color:transparent}
  .ed-help{font-size:11.5px; color:#94a3b8}
  .tgrid{display:flex; flex-wrap:wrap; gap:5px; align-items:center}
  .tgrid .chip{min-width:2.4em; text-align:center}
  .card input.bn{width:2.6em; text-align:center}
  .ed-move{display:flex; gap:8px; padding:12px 0 0}
  .ed-move button{flex:1; font:inherit; font-size:15px; background:#e2e8f0; color:#0f172a; border:0; border-radius:10px; padding:12px; cursor:pointer}
  .ed-move button:disabled{opacity:.35; cursor:default}
  .ed-tools{display:flex; gap:8px; padding:10px 0 0; flex-wrap:wrap}
  .ed-tools button{font:inherit; font-size:13px; background:transparent; color:#475569; border:1px solid #cbd5e1; border-radius:8px; padding:6px 10px; cursor:pointer}
  .ed-tools button:disabled{opacity:.35; cursor:default}
  .ed-tools button.del{color:#be123c; border-color:#fecdd3; margin-left:auto}
  .ed .pvtoggle{padding-top:16px}

  /* ───────── 인쇄 ───────── */
  @page{ size:A4 portrait; margin:1.401cm 2cm; }
  @media print{
    body{background:#fff}
    .bar,.sync,.hint,.ed,.pvtoggle{display:none !important}
    body.pv .stage{position:static; visibility:visible}
    .stage{padding:0; display:block}
    .sheet{width:17cm; box-shadow:none; transform:none !important; margin-bottom:0 !important}
    .draghandle,.ph{display:none !important}
    #rows tr td{background:transparent !important}
    .sheet, .sheet *{ -webkit-print-color-adjust:exact; print-color-adjust:exact; }
    html,body{width:17cm}
  }
</style>
</head>
<body>

<div class="bar">
  <b>인계장</b>
  <div class="cnt">
    <button id="minus" title="칸 수 줄이기">−</button>
    <span id="cntLabel">13명</span>
    <button id="plus" title="칸 수 늘리기">+</button>
  </div>
  <button id="printBtn" class="primary">인쇄</button>
  <button id="syncBtn">연동</button>
  <button id="clearBtn" class="danger">전체 지우기</button>
  <div class="sp"></div>
  <div class="hint">저장 안 됨 — 새로고침하면 다 날아가요. 옮기려면 <b>연동</b>으로 코드 복사. 입력은 환자 칸을 눌러 개별 인계장에서 · <a href="classic.html">이전 버전</a></div>
</div>

<div class="sync" id="syncpanel">
  <label>내보내기 — 이 코드를 복사해서 다른 기기 인계장에 붙여넣으세요</label>
  <textarea id="sync-out" readonly></textarea>
  <div class="row">
    <button id="syncCopy">복사</button>
    <button id="syncSave">.txt로 저장</button>
  </div>
  <label>가져오기 — 코드를 붙여넣고 적용 (이전 버전 코드도 됩니다)</label>
  <textarea id="sync-in" placeholder="HND1:..."></textarea>
  <div class="row">
    <button id="syncApply">적용</button>
    <button id="syncOpen">파일 열기</button>
    <input type="file" id="syncFile" accept=".txt,text/plain" style="display:none">
  </div>
</div>

<div class="stage">
  <div class="sheet" id="sheet">
    <table class="form">
      <colgroup><col style="width:2.4cm"><col style="width:6.9cm"><col style="width:7.46cm"></colgroup>
      <tbody id="rows"></tbody>
    </table>
  </div>
</div>

<div class="pvtoggle sheetonly"><button id="pvOpen">개별 인계장</button></div>

<div class="ed" id="ed">
  <div class="ed-nav" id="edNav"></div>
  <div class="card" id="edCard"></div>
  <div class="ed-move"><button id="edPrev">◀ 이전</button><button id="edNext">다음 ▶</button></div>
  <div class="ed-tools"><button id="edUp">순서 위로</button><button id="edDown">순서 아래로</button><button id="edDel" class="del">이 환자 삭제</button></div>
  <div class="pvtoggle"><button id="pvClose">전체 인계장으로</button></div>
</div>

<datalist id="dl-diet"><option>NPO</option><option>SOW</option><option>RD</option><option>LD</option><option>DM식</option><option>저염식</option><option>TF</option></datalist>
<datalist id="dl-act"><option>ABR</option><option>BR</option><option>자유</option><option>보조보행</option><option>W/C</option></datalist>

<script>
(function(){
  "use strict";
  const $ = s => document.querySelector(s);

  const MAX = 13;
  const USABLE_CM = 29.7 - 1.401*2;   // 26.898cm
  const MIN_BLK_CM = 0.681*3;         // 원본 3행 블록 높이
  const MAX_BLK_CM = 0.95*3;
  const PX_CM = 96/2.54;
  const WDAYS = ["일","월","화","수","목","금","토"];
  const MED_TYPES = ["A","P","U"];
  // 체크 토글 (이전 버전과 같은 키): 켜진 것만 전체 인계장에 찍힘. null = 구분 간격
  const TOGGLES = [["io","I/O"],["defe","defe"],null,["bp","BP"],["hr","HR"],["bpr","T"],["s","S"],["rr","RR"],null,
                   ["lab","L"],["ua","U"],["ekg","E"],["rad","R"],null,["b","B*"],["m","m"]];
  const IV_DUE = 3;   // IV 경과일 경고 기준(일)
  // V/S 칸에 형광펜으로 표시되는 토글 (전체탭 글씨에서는 빠짐). B* = BST → V/S 끝 [BST]
  const VS_KEYS = ["bp","hr","bpr","s","rr","b"];
  const VSQ = [8, 4, 2, 1];   // V/S 측정 간격(hr). 기본 q8hr, 아닌 것만 전체탭에 빨갛게

  /* ── 데이터: 환자 배열이 단일 진실원. 두 화면은 여기서 그리기만 ── */
  let count = MAX;
  let P = Array.from({ length:count }, () => ({}));
  let edIdx = 0, pvOn = false, edLinePick = false;

  const esc = v => String(v == null ? "" : v).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
  const str = v => (v == null ? "" : String(v)).trim();
  const medOn = m => !!m && MED_TYPES.some(t => Array.isArray(m[t]) && (m[t].length > 1 || +m[t][0]));
  // 빈 값 제거한 사본 (내보내기·빈 칸 판정용)
  function clean(o){
    const r = {};
    for (const [k, v] of Object.entries(o || {})){
      if (k === "med"){ if (medOn(v)) r[k] = v; continue; }
      if (Array.isArray(v)){
        const a = v.map(x => { const c = {}; for (const [kk, vv] of Object.entries(x || {})) if (vv && str(vv)) c[kk] = vv; return c; })
                   .filter(x => Object.keys(x).some(kk => kk !== "c"));
        if (a.length) r[k] = a;
      } else if (typeof v === "number"){ if (v) r[k] = v; }
      else if (str(v)) r[k] = v;
    }
    return r;
  }
  const filled = o => Object.keys(clean(o)).length > 0;

  /* ── 날짜 ── */
  const parseMD = v => { const m = (v || "").match(/^\s*(\d{1,2})\s*\/\s*(\d{1,2})\s*$/); return m ? [+m[1], +m[2]] : null; };
  // m/d → 오늘에 가장 가까운 연도로 요일
  function wdayOf(v){
    const md = parseMD(v); if (!md) return "";
    const [mo, d] = md; if (mo < 1 || mo > 12 || d < 1 || d > 31) return "";
    const now = new Date(); now.setHours(0,0,0,0);
    const y = now.getFullYear();
    const dt = [y - 1, y, y + 1].map(yy => new Date(yy, mo - 1, d)).filter(x => x.getMonth() === mo - 1)
      .sort((a, b) => Math.abs(a - now) - Math.abs(b - now))[0];
    return dt ? "(" + WDAYS[dt.getDay()] + ")" : "";
  }
  // m/d 또는 일자 → 최근 과거 날짜로 해석, 오늘과의 경과일수
  function daysAgo(v){
    v = (v || "").trim();
    const now = new Date(); now.setHours(0,0,0,0);
    let dt;
    const md = parseMD(v);
    if (md){
      const [mo, d] = md;
      if (mo<1||mo>12||d<1||d>31) return null;
      dt = new Date(now.getFullYear(), mo-1, d);
      if (dt > now) dt = new Date(now.getFullYear()-1, mo-1, d);
      if (dt.getMonth() !== mo-1) return null;
    } else if (/^\d{1,2}$/.test(v)){
      const d = +v; if (d<1||d>31) return null;
      dt = new Date(now.getFullYear(), now.getMonth(), d);
      if (dt > now) dt = new Date(now.getFullYear(), now.getMonth()-1, d);
      if (dt.getDate() !== d) return null;
    } else return null;
    return Math.round((now - dt) / 86400000);
  }
  const isToday = v => { const md = parseMD(v), n = new Date(); return !!md && md[0] === n.getMonth()+1 && md[1] === n.getDate(); };

  // 입원일 = HD 1, 수술일 = POD 0
  const hdOf  = o => { const d = daysAgo(o.adm); return d === null ? "" : "HD " + (d + 1); };
  const podOf = o => { const d = daysAgo(o.op);  return d === null ? "" : "POD " + d; };
  const isIV  = l => /^\s*iv\s*$/i.test(l.t || "");
  /* 라인·튜브 종류별 사정 항목: [키, 라벨, 선택지(있으면 버튼), 전체탭 표시 형식]
     전체탭 태그엔 fmt 있는 것만 짧게 (부위·성상 등은 개별탭에만) */
  const LF = {
    s:   ["s",   "부위"],
    g:   ["g",   "G",      ["18","20","22","24"], v => v + "G"],

  /* ── 이전 버전(v1) 데이터 → 새 형식 ── */
  function htmlText(h){

      <div class="sec"><div class="k">협진</div><div class="v">${cons}<button class="addbtn" data-add="cons">+ 협진</button></div></div>
      <div class="sec"><div class="k">d/c</div><div class="v"><div class="lbl">
        <span class="seg"><button data-dc="0" class="${dc === 0 ? "on" : ""}">없음</button><button data-dc="1" class="${dc === 1 ? "on" : ""}">예정</button><button data-dc="2" class="${dc === 2 ? "on" : ""}">퇴원</button></span>
        ${inp("dcd", "m/d", `inputmode="numeric" ${dc ? "" : "disabled"}`)}<span class="calc" id="calc-wd">${wdayOf(o.dcd)}</span></div></div></div>
      <div class="sec"><div class="k">메모</div><div class="v">${ta("memo", "보호자, 특이사항 …")}</div></div>`;
    document.querySelectorAll("#edCard textarea").forEach(autoGrow);
    renderNav();
  }
  function autoGrow(t){ t.style.height = "auto"; t.style.height = t.scrollHeight + "px"; }
  // 구조가 바뀌어 다시 그릴 때 포커스·커서 유지
  function rerenderEd(focusId){
    const a = document.activeElement;
    const id = focusId || (a && a.id && $("#edCard").contains(a) ? a.id : null);
    let pos = null;
    if (!focusId && a && $("#edCard").contains(a)) try { if (a.selectionStart != null) pos = [a.selectionStart, a.selectionEnd]; } catch(_){}
    renderEd();
    const el = id && document.getElementById(id);
    if (el){ el.focus(); if (pos) try { el.setSelectionRange(pos[0], pos[1]); } catch(_){} }
    refreshOut();
  }

  // 입력 → 데이터만 갱신 (입력칸은 다시 안 그림: 한글 IME 안전)
  $("#edCard").addEventListener("input", e => {
    const t = e.target, o = cur();
    if (t.tagName === "TEXTAREA") autoGrow(t);
    if (t.dataset.f){
      const f = t.dataset.f;
      o[f] = t.value;
      if (f === "adm") $("#calc-hd").textContent = hdOf(o);
      if (f === "op")  $("#calc-pod").textContent = podOf(o);
      if (f === "dcd"){                         // 날짜가 오늘이면 퇴원 확정, 아니면 예정
        $("#calc-wd").textContent = wdayOf(o.dcd);
        if (+o.dc){ o.dc = isToday(o.dcd) ? 2 : 1; document.querySelectorAll("[data-dc]").forEach(b => b.classList.toggle("on", +b.dataset.dc === o.dc)); }
      }
      if (f === "name" || f === "bed") renderNav();
    } else if (t.dataset.list){
      const arr = o[t.dataset.list] = o[t.dataset.list] || [];
      const it = arr[+t.dataset.j] = arr[+t.dataset.j] || {};
      it[t.dataset.p] = t.value;
      if (t.dataset.list === "lines"){ const s = document.querySelector(`[data-lcalc="${t.dataset.j}"]`); if (s) s.innerHTML = lineCalc(it); }
    }
    refreshOut();
  });
  // IV 삽입일 입력을 마치면(칸 벗어날 때) 3일 이상이면 할 일에 "IV change" 자동 추가
  $("#edCard").addEventListener("change", e => {
    const t = e.target; if (t.dataset.list !== "lines") return;
    const o = cur(), l = (o.lines || [])[+t.dataset.j]; if (!l || !isIV(l)) return;
    const d = lineDays(l); if (d === null || d < IV_DUE) return;
    o.todo = o.todo || [];
    if (o.todo.some(r => str(r.t) === "IV change")) return;
    o.todo.push({ t:"IV change" });
    setTimeout(() => rerenderEd(), 0);   // 다음 칸으로 포커스가 옮겨간 뒤 다시 그림
  });
  $("#edCard").addEventListener("click", e => {
    const o = cur(), t = e.target;
    const tg = t.closest("[data-tg]");
    if (tg){
      const k = tg.dataset.tg;
      if (k === "b"){            // B*: 끔 → 4 → 2 → 1 → 직접 입력 → 끔
        const v = str(o.bn);
        if (!o.b){ o.b = 1; o.bn = "4"; }
        else if (v === "4") o.bn = "2";
        else if (v === "2") o.bn = "1";
        else if (v === "1"){ o.bn = ""; rerenderEd("f-bn"); return; }
        else { o.b = 0; o.bn = ""; }
      } else o[k] = o[k] ? 0 : 1;
      rerenderEd(); return;
    }
    const set = t.closest("[data-set]");
    if (set){ o[set.dataset.set] = o[set.dataset.set] === set.dataset.v ? "" : set.dataset.v; rerenderEd(); return; }
    const dcb = t.closest("[data-dc]");
    if (dcb){
      o.dc = +dcb.dataset.dc;
      if (o.dc === 0) o.dcd = "";
      if (o.dc === 2) o.dcd = todayMD();
      rerenderEd(o.dc === 1 ? "f-dcd" : null); return;
    }
    if (t.closest("[data-linepick]")){ edLinePick = !edLinePick; rerenderEd(); return; }
    const al = t.closest("[data-addline]");
    if (al){
      o.lines = o.lines || [];
      o.lines.push({ t: al.dataset.addline === "기타" ? "" : al.dataset.addline });
      edLinePick = false;
      const j = o.lines.length - 1;
      rerenderEd(al.dataset.addline === "기타" ? `l-${j}-t` : `l-${j}-d`); return;
    }
    const lo = t.closest("[data-lopt]");
    if (lo){
      const l = o.lines[+lo.dataset.lopt];
      l[lo.dataset.p] = str(l[lo.dataset.p]) === lo.dataset.v ? "" : lo.dataset.v;
      rerenderEd(); return;
    }
    const add = t.closest("[data-add]");
    if (add){
      const k = add.dataset.add; o[k] = o[k] || []; o[k].push({});
      const j = o[k].length - 1;
      rerenderEd(k === "todo" ? `t-${j}` : `c-${j}-t`); return;
    }
    const del = t.closest("[data-del]");
    if (del){ (o[del.dataset.del] || []).splice(+del.dataset.j, 1); rerenderEd(); return; }
    if (t.closest("[data-vsq]")){
      const q = VSQ[(VSQ.indexOf(+o.vsq || 8) + 1) % VSQ.length];
      o.vsq = q === 8 ? 0 : q; rerenderEd(); return;
    }
    const chk = t.closest("[data-chk]");
    if (chk){ const r = o.todo[+chk.dataset.chk]; r.c = r.c ? 0 : 1; rerenderEd(); return; }
  });
  // 할 일: Enter → 다음 줄 추가, 빈 줄 Backspace → 삭제
  $("#edCard").addEventListener("keydown", e => {
    const t = e.target; if (t.dataset.list !== "todo") return;
    if (e.isComposing || e.keyCode === 229) return;   // 한글 조합 확정용 Enter는 무시
    const o = cur(), j = +t.dataset.j;
    if (e.key === "Enter"){ e.preventDefault(); o.todo.splice(j + 1, 0, {}); rerenderEd(`t-${j + 1}`); }
    else if (e.key === "Backspace" && !t.value){ e.preventDefault(); o.todo.splice(j, 1); rerenderEd(j > 0 ? `t-${j - 1}` : null); }
  });

  /* 약 A P U: 탭=색 순환, 길게=같은 글자 추가, 두 번 탭=삭제(종류별 마지막 1개는 끔으로) */
  (function bindMeds(){
    const box = $("#edCard");
    let lp = null, longFired = false, downEl = null, sx = 0, sy = 0, last = { el:null, t:0 };
    const cancel = () => { clearTimeout(lp); lp = null; };
    const st = el => +((el.className.match(/\bm(\d)\b/) || [0, 0])[1]);
    const setSt = (el, s) => { el.classList.remove("m0","m1","m2","m3"); el.classList.add("m" + s); };
    const save = () => {
      const mz = $("#mz"), m = {};
      MED_TYPES.forEach(t => m[t] = [...mz.querySelectorAll(`.medl[data-t="${t}"]`)].map(st));
      cur().med = m; refreshOut();
    };
    box.addEventListener("pointerdown", e => {
      downEl = e.target.closest(".medl"); if (!downEl) return;
      longFired = false; sx = e.clientX; sy = e.clientY; cancel();
      const el = downEl;
      lp = setTimeout(() => { lp = null; longFired = true; const n = el.cloneNode(true); setSt(n, 1); el.after(n); last = { el:null, t:0 }; save(); }, 500);
    });
    box.addEventListener("pointermove", e => { if (lp && Math.hypot(e.clientX - sx, e.clientY - sy) > 8) cancel(); });
    box.addEventListener("pointercancel", cancel);
    box.addEventListener("contextmenu", e => { if (e.target.closest(".medl")) e.preventDefault(); });   // 폰 길게 누르기 메뉴 방지
    box.addEventListener("pointerup", () => {
      const el = downEl; downEl = null; cancel();
      if (!el || longFired || !el.isConnected) return;
      const now = Date.now(), mz = $("#mz");
      if (last.el === el && now - last.t < 350){
        last = { el:null, t:0 };
        if (mz.querySelectorAll(`.medl[data-t="${el.dataset.t}"]`).length > 1) el.remove(); else setSt(el, 0);
      } else { last = { el, t:now }; setSt(el, (st(el) + 1) % 4); }
      save();
    });
  })();

  function edStep(dir){
    const list = navList(), k = list.findIndex(x => x.i === edIdx), nx = list[k + dir];
    if (nx){ edIdx = nx.i; renderEd(); window.scrollTo(0, 0); }
  }
  function openEd(i){
    edIdx = Math.max(0, Math.min(count - 1, i));
    pvOn = true; document.body.classList.add("pv");
    renderEd(); window.scrollTo(0, 0);
    if (!filled(cur())) $("#f-name").focus();   // 빈 칸을 눌렀으면 바로 이름 입력
  }
  function closeEd(){
    pvOn = false; document.body.classList.remove("pv");
    renderSheet(); window.scrollTo(0, 0);
  }
  $("#pvOpen").addEventListener("click", () => { const f = P.findIndex(filled); openEd(f >= 0 ? f : 0); });
  $("#pvClose").addEventListener("click", closeEd);
  $("#edPrev").addEventListener("click", () => edStep(-1));
  $("#edNext").addEventListener("click", () => edStep(1));
  $("#edNav").addEventListener("click", e => {
    const b = e.target.closest("button"); if (!b) return;
    if (b.dataset.new){
      let i = P.findIndex((o, k) => !filled(o) && k !== edIdx);
      if (i < 0 && !filled(cur())) i = edIdx;
      if (i < 0){ if (count >= MAX) return; count++; P.push({}); i = count - 1; }
      edIdx = i; renderEd(); $("#f-name").focus(); return;
    }
    edIdx = +b.dataset.i; renderEd();
  });
  function moveCur(dir){
    const j = edIdx + dir; if (j < 0 || j >= count) return;
    [P[edIdx], P[j]] = [P[j], P[edIdx]]; edIdx = j; renderNav(); refreshOut();
  }
  $("#edUp").addEventListener("click", () => moveCur(-1));
  $("#edDown").addEventListener("click", () => moveCur(1));
  $("#edDel").addEventListener("click", () => {
    if (filled(cur()) && !confirm(`${str(cur().name) || "이 환자"} 내용을 지울까요?`)) return;
    P.splice(edIdx, 1); P.push({});            // 아래 환자들이 한 칸씩 올라옴
    const list = P.map((o, i) => i).filter(i => filled(P[i]));
    edIdx = list.length ? (list.find(i => i >= edIdx) ?? list[list.length - 1]) : 0;
    renderEd(); refreshOut();
  });
  // 좌우 스와이프(입력칸 밖에서)로 이전/다음
  let touch = null;
  $("#ed").addEventListener("touchstart", e => {
    if (e.target.closest("input,textarea,.medl,.ed-nav")){ touch = null; return; }
    const t = e.touches[0]; touch = { x:t.clientX, y:t.clientY };
  }, { passive:true });
  $("#ed").addEventListener("touchend", e => {
    if (!touch) return;
    const t = e.changedTouches[0], dx = t.clientX - touch.x, dy = t.clientY - touch.y; touch = null;
    if (Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy) * 1.5) edStep(dx < 0 ? 1 : -1);
  });

  /* ════════════ 연동: XOR(고정키) → base64, 접두사 HND1: (이전 버전과 호환) ════════════ */
  const XKEY = "handoff-sheet-sync-key";
  function xorBytes(bytes){
    const k = new TextEncoder().encode(XKEY), out = new Uint8Array(bytes.length);
    for (let i=0;i<bytes.length;i++) out[i] = bytes[i] ^ k[i % k.length];
    return out;
  }
  function encode(s){ const b = xorBytes(new TextEncoder().encode(s)); let bin = ""; b.forEach(x => bin += String.fromCharCode(x)); return "HND1:" + btoa(bin); }
  function decode(code){
    code = (code||"").trim();
    if (!code.startsWith("HND1:")) return code;          // 평문 JSON도 하위호환
    return new TextDecoder().decode(xorBytes(Uint8Array.from(atob(code.slice(5)), c => c.charCodeAt(0))));
  }
  const exportStr = () => JSON.stringify({ v:2, n:count, p:P.map(clean) });
  function refreshOut(){ if ($("#syncpanel").classList.contains("open")) $("#sync-out").value = encode(exportStr()); }
  function flash(btn, text){ const o = btn.textContent; btn.textContent = text; setTimeout(() => btn.textContent = o, 1200); }
  function applyStr(raw){
    let s;
    try { s = decode((raw||"").trim()); } catch { alert("코드 형식이 올바르지 않아요."); return; }
    if (!s){ alert("불러올 코드나 파일이 없어요."); return; }
    let data; try { data = JSON.parse(s); } catch { alert("코드 형식이 올바르지 않아요."); return; }
    let list = Array.isArray(data.p) ? data.p : (Array.isArray(data) ? data : null);
    if (!list){ alert("인계장 데이터를 찾을 수 없어요."); return; }
    list = list.map(o => (o && typeof o === "object") ? o : {});
    if (data.v !== 2) list = list.map(migrate);          // 이전 버전 코드 → 새 형식
    const n = list.filter(filled).length;
    if (!confirm(`지금 화면을 불러온 데이터(${n}명 기재)로 덮어쓸까요?`)) return;
    count = Math.min(MAX, Math.max(1, data.n || list.length || MAX));
    P = Array.from({ length:count }, (_, i) => list[i] || {});
    $("#syncpanel").classList.remove("open");
    if (pvOn){ const f = P.findIndex(filled); edIdx = f >= 0 ? f : 0; renderEd(); }
    renderSheet();
    alert("적용됐어요.");
  }

  /* ════════════ 툴바 ════════════ */
  $("#plus").addEventListener("click", () => { if (count < MAX){ count++; P.push({}); renderSheet(); if (pvOn) renderNav(); } });
  $("#minus").addEventListener("click", () => {
    if (count <= 1) return;
    if (filled(P[count-1]) && !confirm("마지막 칸에 적힌 내용이 지워져요. 계속할까요?")) return;
    count--; P.pop();
    if (edIdx >= count) edIdx = count - 1;
    renderSheet(); if (pvOn) renderEd();
  });
  $("#printBtn").addEventListener("click", () => { renderSheet(); window.print(); });
  window.addEventListener("beforeprint", renderSheet);
  $("#clearBtn").addEventListener("click", () => {
    if (P.some(filled) && !confirm("전체 내용을 지울까요? 되돌릴 수 없어요.")) return;
    P = Array.from({ length:count }, () => ({})); edIdx = 0;
    renderSheet(); if (pvOn) renderEd();
  });
  $("#syncBtn").addEventListener("click", () => {
    const p = $("#syncpanel");
    if (p.classList.contains("open")){ p.classList.remove("open"); return; }
    $("#sync-out").value = encode(exportStr()); $("#sync-in").value = ""; p.classList.add("open");
  });
  $("#syncCopy").addEventListener("click", async () => {
    const el = $("#sync-out");
    try { await navigator.clipboard.writeText(el.value); } catch { el.select(); document.execCommand("copy"); }
    flash($("#syncCopy"), "복사됨!");
  });
  $("#syncSave").addEventListener("click", () => {
    const blob = new Blob([encode(exportStr())], { type:"text/plain" });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    const n = new Date(), p2 = x => String(x).padStart(2, "0");   // 로컬 날짜 (toISOString은 UTC라 09시 전엔 전날)
    a.download = `handoff-${n.getFullYear()}-${p2(n.getMonth()+1)}-${p2(n.getDate())}.txt`;
    a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  });
  $("#syncApply").addEventListener("click", () => applyStr($("#sync-in").value));
  $("#syncOpen").addEventListener("click", () => $("#syncFile").click());
  $("#syncFile").addEventListener("change", e => {
    const f = e.target.files[0]; if (!f) return;
    const rd = new FileReader(); rd.onload = () => applyStr(rd.result); rd.readAsText(f);
    e.target.value = "";
  });

  /* ── 폰에서 가로폭 맞추기 (인쇄엔 영향 없음) ── */
  function scaleToFit(){
    const sheet = $("#sheet");
    sheet.style.transform = "none"; sheet.style.marginBottom = "";
    const avail = document.querySelector(".stage").clientWidth - 4, w = sheet.offsetWidth;
    if (w > avail && avail > 0){
      const s = avail / w;
      sheet.style.transform = `scale(${s})`;
      sheet.style.marginBottom = (sheet.offsetHeight * (s - 1)) + "px";
    }
  }
  window.addEventListener("resize", () => { if (!pvOn) scaleToFit(); });

  /* ── 실수로 닫기 방지 (저장은 안 함) ── */
  window.addEventListener("beforeunload", e => { if (P.some(filled)){ e.preventDefault(); e.returnValue = ""; } });

  renderSheet();

  if ("serviceWorker" in navigator)
    window.addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(()=>{}));
})();
</script>
</body>
</html>
