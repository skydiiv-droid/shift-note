<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#334155">
<title>인계장</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="인계장">
<style>
  :root{
    --ink:#000;
    --line:0.5pt solid #000;
    --guide:#e2e8f0;
    --ph:#cbd5e1;
    --po:#4ade80; --inj:#60a5fa; --etc:#facc15;   /* 약 경로: 경구 / 주사 / 기타 */
    --warn:#c2410c;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:#f1f5f9;
    font-family:'맑은 고딕','Malgun Gothic','Apple SD Gothic Neo',sans-serif;
    color:#0f172a;
    -webkit-text-size-adjust:100%;
  }

  /* ───────── 툴바 ───────── */
  .bar{
    position:sticky; top:0; z-index:20;
    background:#334155; color:#fff;
    padding:8px 10px;
    display:flex; flex-wrap:wrap; gap:6px; align-items:center;
    box-shadow:0 1px 4px rgba(0,0,0,.25);
  }
  .bar b{font-size:14px; margin-right:4px; letter-spacing:.5px}
  .bar button{
    font:inherit; font-size:13px;
    background:#475569; color:#fff; border:0; border-radius:6px;
    padding:6px 10px; cursor:pointer; white-space:nowrap;
  }
  .bar button:hover{background:#64748b}
  .bar button.primary{background:#0ea5e9}
  .bar button.primary:hover{background:#38bdf8}
  .bar button.danger{background:#9f1239}
  .bar button.danger:hover{background:#be123c}
  .cnt{display:flex; align-items:center; gap:4px; background:#475569; border-radius:6px; padding:2px 4px}
  .cnt button{padding:3px 9px; background:transparent; font-size:15px; line-height:1}
  .cnt span{font-size:13px; min-width:56px; text-align:center}
  .sp{flex:1}
  .hint{font-size:11px; color:#cbd5e1; width:100%; margin-top:2px}
  .hint a{color:#cbd5e1}

  /* ───────── 연동 패널 ───────── */
  .sync{display:none; background:#1e293b; color:#e2e8f0; padding:10px; gap:8px; flex-direction:column}
  .sync.open{display:flex}
  .sync .row{display:flex; gap:6px; align-items:center; flex-wrap:wrap}
  .sync label{font-size:12px; color:#94a3b8; width:100%}
  .sync textarea{
    width:100%; height:58px; resize:vertical;
    font-family:ui-monospace,Menlo,Consolas,monospace; font-size:11px;
    border-radius:6px; border:1px solid #475569; background:#0f172a; color:#e2e8f0; padding:6px;
  }
  .sync button{
    font:inherit; font-size:12px; background:#475569; color:#fff;
    border:0; border-radius:6px; padding:5px 10px; cursor:pointer;
  }
  .sync button:hover{background:#64748b}
  .smsg{font-size:13px; line-height:1.5; border-radius:6px; padding:8px 10px; background:#334155; color:#e2e8f0}
  .smsg.err{background:#7f1d1d; color:#fecaca}
  .smsg.ok{background:#14532d; color:#bbf7d0}
  .smsg .row{margin-top:6px}
  .sync button.go{background:#0ea5e9}
  .toast{position:fixed; left:50%; bottom:24px; transform:translateX(-50%); z-index:80; background:#14532d; color:#fff; font-size:14px; padding:10px 16px; border-radius:10px; box-shadow:0 4px 14px rgba(0,0,0,.3)}

  /* ───────── 전체 인계장 (A4, 자동 요약) ───────── */
  .stage{padding:14px; display:flex; flex-direction:column; align-items:center; gap:14px}
  .sheet{width:17cm; background:#fff; box-shadow:0 2px 12px rgba(15,23,42,.18); transform-origin:top center; position:relative}
  /* 간호기록 버튼: 종이 오른쪽 바깥 (인쇄 안 됨, 좁은 화면에선 개별탭 버튼 사용) */
  .chartcol{position:absolute; top:0; left:100%; width:78px; height:100%}
  .chartbtn{position:absolute; left:10px; transform-origin:left center; font:inherit; font-size:12px; background:#0e8c7a; color:#fff; border:0; border-radius:8px; padding:5px 8px; cursor:pointer; white-space:nowrap}
  .chartbtn:hover{background:#0b7566}
  table.form{width:16.76cm; margin:0 auto; border-collapse:collapse; table-layout:fixed}   /* 17cm→16.76: 인쇄 우측 잘림 방지 */
  table.form td{padding:0; border:var(--line); vertical-align:top; overflow:hidden; color:var(--ink)}
  @media screen{
    #sheets tr:hover td{background:#f8fafc; cursor:pointer}
    #sheets tr.drop-target td{background:#e0f2fe}
  }

  /* 이름 칸 */
  td.c-name{position:relative}
  .nmbox{display:flex; flex-direction:column; justify-content:center; height:100%; padding:1px 3px 1px 12px; gap:1px}
  .nm-top{display:flex; justify-content:space-between; align-items:baseline; font-size:7pt; white-space:nowrap; gap:2px}
  .nm-top .bed{font-family:ui-monospace,Menlo,Consolas,monospace}
  .nm-top .dc.big b{font-size:1.2em}
  .nm-name{font-size:10.5pt; font-weight:700; text-align:center; white-space:nowrap; overflow:hidden}
  .nm-name.struck{text-decoration:line-through}
  .nm-sub{font-size:7pt; text-align:center; white-space:nowrap; overflow:hidden}
  .ph{color:var(--ph); font-weight:400}
  .dcslash{position:absolute; left:0; top:0; width:100%; height:100%; pointer-events:none; display:none; z-index:1}
  .dcslash line{stroke:#dc2626; stroke-width:1; vector-effect:non-scaling-stroke}
  td.c-name.dctoday .dcslash{display:block}
  .draghandle{
    position:absolute; left:0; top:0; bottom:0; z-index:6; width:11px;
    display:flex; align-items:center; justify-content:center;
    font-size:11px; line-height:1; color:#94a3b8; cursor:grab; user-select:none; touch-action:none;
  }
  .draghandle:hover{color:#0ea5e9}
  body.dragging, body.dragging *{cursor:grabbing !important; user-select:none}

  /* 요약 칸: 3줄 (진단 / 태그 / 체크 토글 + V/S 손글씨) */
  .sumbox{display:flex; flex-direction:column; height:100%; padding:1px 3px}
  .ln{flex:1; display:flex; align-items:center; gap:3px; white-space:nowrap; overflow:hidden; min-height:0}
  .ln1{font-size:9pt; font-weight:600}
  .ln1 small{font-weight:400; font-size:.85em}
  .ln1 .co{font-weight:400; margin-left:4px}
  .ln2{font-size:7.5pt; gap:1px 2px; flex:1.3; flex-wrap:wrap; align-content:center; white-space:normal}
  .ln2 > *{white-space:nowrap}
  .ln2 .rk{padding:0 2px; line-height:1.25}
  .ln2 .msep{display:inline-block; width:4px}
  .medc.xoff{background:none; color:#d5dce5; font-weight:400}
  body.printing .mx{display:none !important}
  .mzone .medl{min-width:2.4em}
  .medc[data-med], .t[data-aidpick], .t[data-o2]{cursor:pointer}
  .o2in{width:7em}
  .ln2b{font-size:7.5pt; flex:1.4; flex-wrap:wrap; align-content:center; row-gap:1px; white-space:normal}   /* 태그 많으면 2줄 */
  .ln2b > *{white-space:nowrap}
  .t.xoff{border-style:dashed; border-color:#d5dce5; color:#cbd5e1}
  .ti{-webkit-touch-callout:none}
  .ln3{font-size:7.5pt}
  .ln4{font-size:8pt; flex:1.1}
  .vsm{font-weight:700; margin-right:3px}
  .medc.pca.p1{background:var(--inj)} .medc.pca.p2{background:#fb923c} .medc.pat{background:var(--etc)}
  .medc[data-pca], .medc[data-pat]{cursor:pointer; padding:0 1px}
  .medc.pat.due{background:#dc2626; color:#fff}
  .t{border:0.5pt solid #333; border-radius:2px; padding:0 2px; line-height:1.25}
  .t.hi{background:#111; color:#fff; border-color:#111; font-weight:700}
  .medc{font-weight:600; font-size:5.5pt; padding:0 1px; border-radius:1.5px; line-height:1.1; letter-spacing:-.1px}   /* 약은 작게 */
  .medc.fl{background:none; border:0.4pt solid #64748b; color:#334155}
  .m1{background:var(--po)} .m2{background:var(--inj)} .m3{background:var(--etc)}
  .tgs{font-weight:600}
  .vstpl{white-space:nowrap; color:var(--ink); margin-left:auto}
  .vsl{display:inline-block; min-width:1.9em; text-align:center}   /* em: 글씨 줄이면 칸도 같이 줄어 넘치지 않게 */
  .vsl i{font-style:normal; font-size:5.5pt; color:#c3ccd8}
  .vsl.hl{background:#fde047; border-radius:1px}        /* 개별탭에서 체크한 V/S = 형광펜 */
  .vsl.hl i{color:#a16207}
  .vsq{color:#dc2626; font-weight:700; margin-right:3px}  /* q8hr 아닐 때만 */
  /* 전체탭에서 바로 누르는 토글: 꺼진 건 화면에만 흐리게, 인쇄 땐 안 보임 */
  .qt{cursor:pointer; border-radius:2px}
  .qt.xoff{color:#d5dce5; font-weight:400}
  .qt.xoff i{color:#d5dce5}
  .tgs .qt{margin-right:3px}
  .tgs .sep{display:inline-block; width:5px}
  @media screen{ .qt:hover{outline:1px solid #0ea5e9} }
  .vsq.xoff{color:#d5dce5; font-weight:400}
  #sheets tr.qcur td{background:#f0f9ff}

  /* 할 일 칸: 가로 흐름, 남는 아래 공간은 근무 중 손글씨 */
  .todobox{display:flex; flex-wrap:wrap; align-content:flex-start; gap:0 6px; padding:1px 3px; height:100%; font-size:8pt; line-height:1.3; overflow:hidden}
  .ti{white-space:nowrap}
  .ti.done{color:#64748b}
  .ti .ck{margin-left:2px; cursor:pointer; border-radius:2px}
  @media screen{ .ti .ck:hover{background:#e0f2fe} }
  .tadd{display:inline-block; width:1.25em; height:1.25em; line-height:1.1em; text-align:center; border:1px solid #94a3b8; border-radius:50%;
    color:#475569; font-size:.9em; cursor:pointer; user-select:none}
  .tadd:hover{background:#0ea5e9; color:#fff; border-color:#0ea5e9}
  .tin{font:inherit; border:0; border-bottom:1px solid #0ea5e9; outline:0; background:#f0f9ff; width:8em; padding:0 2px}
  .nmin{font:inherit; font-weight:700; text-align:center; width:100%; border:0; border-bottom:1px solid #0ea5e9; outline:0; background:#f0f9ff; padding:0}
  /* 우클릭 서식 메뉴 */
  .ctxmenu{position:fixed; z-index:60; background:#1e293b; border:1px solid #475569; border-radius:8px; padding:6px; box-shadow:0 6px 20px rgba(0,0,0,.35)}
  .ctxmenu .cm-row{display:flex; gap:4px; margin:3px 0}
  .ctxmenu button{font:inherit; font-size:13px; line-height:1; min-width:28px; height:28px; padding:0 6px; border:1px solid #475569; border-radius:6px; background:#0f172a; color:#e2e8f0; cursor:pointer}
  .ctxmenu button:hover{outline:2px solid #38bdf8}
  .ctxmenu .cm-colors button{font-weight:700; font-size:15px}
  .ctxmenu.vsmode .cm-colors, .ctxmenu.vsmode .cm-row:last-child{display:none}
  .aidmenu button.on{background:#0ea5e9; border-color:#0ea5e9; color:#fff}
  .ti b{font-weight:700}

  /* ───────── 개별 인계장 (입력) ───────── */
  .pvtoggle{display:flex; justify-content:center; padding:6px 14px 28px}
  .pvtoggle button{font:inherit; font-size:15px; background:#334155; color:#fff; border:0; border-radius:10px; padding:12px 22px; cursor:pointer}
  .pvtoggle button:hover{background:#475569}
  .ed{display:none; max-width:620px; margin:0 auto; padding:12px 12px 0}
  body.pv .ed{display:block}
  body.pv .pvtoggle.sheetonly, body.tv .pvtoggle.sheetonly{display:none}
  .pvtoggle{gap:8px; flex-wrap:wrap}
  .pvtoggle button.sub{background:#e2e8f0; color:#0f172a}
  .pvtoggle button.sub:hover{background:#cbd5e1}
  /* 전체 인계장은 지우지 않고 화면 밖으로만 → 크기 측정이 계속 정상 */
  body.pv .stage, body.tv .stage{position:absolute; left:-10000px; top:0; visibility:hidden}

  /* 할 일 모아보기 (모든 환자 + 병동 공통) */
  .tvw{display:none; max-width:620px; margin:0 auto; padding:12px 12px 0}
  body.tv .tvw{display:block}
  .tv-head{display:flex; align-items:baseline; gap:10px; margin:2px 2px 10px}
  .tv-head h2{font-size:18px; margin:0}
  .tv-head .cnt2{color:#64748b; font-size:13px}
  .tv-head label{margin-left:auto; font-size:13px; color:#475569; display:flex; align-items:center; gap:4px; cursor:pointer}
  .tv-grp{background:#fff; border-radius:12px; box-shadow:0 2px 10px rgba(15,23,42,.10); padding:8px 12px 10px; margin-bottom:10px; font-size:15px}
  .tv-grp.ward{border:2px solid #334155}
  .tv-pt{display:flex; align-items:baseline; gap:6px; padding:2px 0 6px; border-bottom:1px solid #e2e8f0; margin-bottom:4px; cursor:pointer}
  .tv-pt .bed{font-family:ui-monospace,Menlo,Consolas,monospace; font-size:12px; color:#475569}
  .tv-pt b{font-size:16px}
  .tv-pt b.struck{text-decoration:line-through}
  .tv-pt .go{margin-left:auto; color:#0369a1; font-size:12px}
  .tv-it{display:grid; grid-template-columns:1.6em minmax(0,1fr) auto; gap:6px; align-items:center; padding:3px 0}
  .tv-it .tx{min-width:0; word-break:break-all}
  .tv-it.done .tx{color:#94a3b8; text-decoration:line-through}
  .tv-it .cb{border:1.5px solid #64748b; border-radius:4px; width:1.3em; height:1.3em; background:#fff; cursor:pointer; padding:0; font-size:13px; line-height:1; color:transparent}
  .tv-it .cb.on{background:#0f172a; border-color:#0f172a; color:#fff}
  .tv-grp.ward .tv-it{grid-template-columns:1.6em minmax(0,1fr) 1.4em}
  .tv-grp.ward input{font:inherit; font-size:15px; border:0; border-bottom:1px solid #e2e8f0; padding:3px 2px; width:100%; min-width:0; outline:0; background:transparent}
  .tv-grp.ward input:focus{border-bottom-color:#0ea5e9; background:#f0f9ff}
  .tv-grp.ward .done input{color:#94a3b8; text-decoration:line-through}
  .tv-empty{color:#64748b; text-align:center; padding:24px 0; font-size:14px}

  /* 전체탭 맨 위 병동 공통 줄 (공통 할 일 있을 때만) */
  #sheets tr.wrow td{vertical-align:middle}
  .wbox{display:flex; flex-wrap:wrap; align-content:center; gap:0 8px; padding:1px 4px; height:100%; font-size:8pt; line-height:1.3; overflow:hidden}
  .wbox .wl{font-weight:700}

  .ed-nav{display:flex; gap:6px; overflow-x:auto; padding:0 0 10px; -webkit-overflow-scrolling:touch}
  .ed-nav button{flex:0 0 auto; font:inherit; font-size:14px; border:1px solid #cbd5e1; background:#fff; color:#0f172a; border-radius:999px; padding:6px 12px; cursor:pointer; white-space:nowrap}
  .ed-nav button.cur{background:#0ea5e9; border-color:#0ea5e9; color:#fff}
  .ed-nav button.dc2{text-decoration:line-through}
  .ed-nav button.add{border-style:dashed; color:#0369a1}
  .card{background:#fff; border-radius:12px; box-shadow:0 2px 10px rgba(15,23,42,.12); padding:12px 14px; font-size:15px; line-height:1.45}
  .card input, .card textarea{
    font:inherit; font-size:15px; color:#0f172a; background:transparent;
    border:0; border-bottom:1px solid #e2e8f0; border-radius:0; padding:4px 2px; width:100%; min-width:0; outline:0;
  }
  .card input:focus, .card textarea:focus{border-bottom-color:#0ea5e9; background:#f0f9ff}
  .card input:disabled{color:#cbd5e1}
  .card select.dsel{font:inherit; font-size:15px; color:#0f172a; background:#fff; border:1px solid #cbd5e1; border-radius:8px; padding:4px 6px; min-width:0; width:100%}
  .card textarea{resize:none; overflow:hidden; line-height:1.4; display:block}
  .card ::placeholder{color:#cbd5e1}
  .hdr{display:grid; grid-template-columns:4.6em minmax(0,1fr); gap:4px 10px; align-items:end; padding-bottom:8px}
  .hdr .nm{font-size:20px; font-weight:700}
  .hdr .bed{font-family:ui-monospace,Menlo,Consolas,monospace}
  .row3{display:grid; grid-template-columns:4.6em auto minmax(0,1fr); gap:10px; align-items:center; grid-column:1/-1}
  .seg{display:inline-flex; border:1px solid #cbd5e1; border-radius:8px; overflow:hidden; flex:0 0 auto}
  .seg button{font:inherit; font-size:13px; border:0; background:#fff; color:#475569; padding:5px 10px; cursor:pointer; white-space:nowrap}
  .seg button + button{border-left:1px solid #cbd5e1}
  .seg button.on{background:#0ea5e9; color:#fff}
  .sec{display:grid; grid-template-columns:3.4em minmax(0,1fr); gap:10px; padding:8px 0; border-top:1px dashed #e2e8f0}
  .sec > .k{color:#64748b; font-size:13px; padding-top:6px}
  .sec > .v{min-width:0; display:flex; flex-direction:column; gap:4px}
  .pair{display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr); gap:10px}
  @media (max-width:420px){ .pair.stack{grid-template-columns:minmax(0,1fr)} }
  .lbl{display:flex; align-items:center; gap:6px; min-width:0}
  .lbl > span{flex:0 0 auto; font-size:12px; color:#64748b; white-space:nowrap}
  .calc{flex:0 0 auto; font-size:13px; font-weight:700; color:#0f172a; white-space:nowrap}
  .calc.due{color:var(--warn)}
  .chips{display:flex; flex-wrap:wrap; gap:5px}
  .chip{font:inherit; font-size:13px; border:1px solid #cbd5e1; background:#fff; color:#94a3b8; border-radius:6px; padding:3px 9px; cursor:pointer; user-select:none}
  .chip.on{border-color:#0f172a; color:#0f172a; font-weight:700}
  .chip.on.hi{background:#0f172a; color:#fff}
  .chip.q{color:#0f172a; border-color:#0f172a}
  .chip.q.alt{background:#dc2626; border-color:#dc2626; color:#fff; font-weight:700}
  .gap{width:8px}
  .li{display:grid; gap:6px; align-items:center}
  /* 라인·튜브: 종류마다 사정 항목이 다른 작은 카드 */
  .lcard{border:1px solid #e2e8f0; border-radius:8px; padding:6px 8px; display:flex; flex-direction:column; gap:4px}
  .lc-top{display:flex; align-items:center; gap:8px}
  .lc-type{font-weight:700; font-size:14px; white-space:nowrap}
  .lc-top input.lc-name{flex:1; font-weight:700}
  .lc-top .lc-date{width:5.5em; flex:0 0 auto}
  .lc-top .x{margin-left:auto}
  .lc-fields{display:flex; flex-wrap:wrap; gap:4px 12px; align-items:center}
  .lf{display:flex; align-items:center; gap:4px; min-width:0}
  .lf > span{font-size:12px; color:#64748b; white-space:nowrap}
  .card .lf input{width:4.2em}
  .card .lf input.w{width:8em}
  .seg.sm button{font-size:12px; padding:2px 8px}
  .rsp{display:inline-flex; align-items:center; gap:4px; font-size:12px; color:#475569}
  .lpick{display:flex; flex-wrap:wrap; gap:5px}
  .lpick .chip{color:#0f172a}
  .li.todo{grid-template-columns:1.6em minmax(0,1fr) 1.8em 1.4em}
  .li .fmt{border:1px solid #cbd5e1; border-radius:6px; background:#fff; color:#475569; font-size:13px; font-weight:700; padding:2px 0; cursor:pointer}
  .li.cons{grid-template-columns:minmax(0,5em) auto minmax(0,1fr) 1.8em 1.4em}
  .chartpre{white-space:pre-wrap; font:inherit; font-size:13px; line-height:1.5; background:#f8fafb; border:1px solid #e2e8f0; border-radius:8px; padding:8px 10px; margin:0}
  .chartbtn2{align-self:flex-start; font:inherit; font-size:14px; background:#0e8c7a; color:#fff; border:0; border-radius:8px; padding:8px 14px; cursor:pointer}
  .sec > .v > .lbl{flex-wrap:wrap; row-gap:4px}   /* 버튼 줄이 길면 다음 줄로 */
  .vsin{display:flex; align-items:center; gap:3px; flex-wrap:wrap; font-size:13px; color:#64748b}
  .card .vsin input{width:3.2em; text-align:center; padding:3px 1px}
  .sxrow{display:flex; flex-wrap:wrap; align-items:center; gap:4px 6px; padding:3px 0; border-top:1px dashed #e2e8f0}
  .sxrow .sxn{font-size:13px; font-weight:600; min-width:5.5em}
  .sxrow input{flex:1; min-width:6em}
  .sxrow input.nrs{flex:0 0 3.5em; min-width:0}
  .li.sorei{grid-template-columns:auto minmax(0,1fr) auto 1.4em}
  .li.dri{grid-template-columns:auto minmax(0,1fr) 1.4em}
  .li .lt{font-size:12px; color:#475569}

  // 폰 숫자 키패드엔 / 가 없음 → 0901, 9.01, 09.01, 9/1, 9-1 모두 m/d로 인식
  function parseMD(v){
    v = (v || "").trim();
    let m = v.match(/^(\d{1,2})\s*[\/.\-]\s*(\d{1,2})\.?$/);
    if (!m) m = v.match(/^(\d{2})(\d{2})$/);
    return m ? [+m[1], +m[2]] : null;
  }
  const fmtMD = v => { const md = parseMD(v); return md ? md[0] + "/" + md[1] : str(v); };
  const DATE_FIELDS = ["adm", "op", "dcd", "patd"];
  // m/d → 오늘에 가장 가까운 연도로 요일
  function wdayOf(v){
    const md = parseMD(v); if (!md) return "";
    const [mo, d] = md; if (mo < 1 || mo > 12 || d < 1 || d > 31) return "";
    const now = new Date(); now.setHours(0,0,0,0);
    const y = now.getFullYear();
    const dt = [y - 1, y, y + 1].map(yy => new Date(yy, mo - 1, d)).filter(x => x.getMonth() === mo - 1)
      .sort((a, b) => Math.abs(a - now) - Math.abs(b - now))[0];
    return dt ? "(" + WDAYS[dt.getDay()] + ")" : "";
  }
  // m/d 또는 일자 → 최근 과거 날짜로 해석, 오늘과의 경과일수
  function daysAgo(v){
    v = (v || "").trim();
    const now = new Date(); now.setHours(0,0,0,0);
    let dt;
    const md = parseMD(v);
    if (md){
      const [mo, d] = md;
      if (mo<1||mo>12||d<1||d>31) return null;
      dt = new Date(now.getFullYear(), mo-1, d);
      if (dt > now) dt = new Date(now.getFullYear()-1, mo-1, d);
      if (dt.getMonth() !== mo-1) return null;
    } else if (/^\d{1,2}$/.test(v)){
      const d = +v; if (d<1||d>31) return null;
      dt = new Date(now.getFullYear(), now.getMonth(), d);
      if (dt > now) dt = new Date(now.getFullYear(), now.getMonth()-1, d);
      if (dt.getDate() !== d) return null;
    } else return null;
    return Math.round((now - dt) / 86400000);
  }
  function daysDiff(v){
    const md = parseMD(v); if (!md) return daysAgo(v);
    const [mo, d] = md; if (mo < 1 || mo > 12 || d < 1 || d > 31) return null;
    const now = new Date(); now.setHours(0,0,0,0);
    const dt = [-1, 0, 1].map(k => new Date(now.getFullYear() + k, mo - 1, d)).filter(x => x.getMonth() === mo - 1)
      .sort((a, b) => Math.abs(a - now) - Math.abs(b - now))[0];
    return dt ? Math.round((now - dt) / 86400000) : null;
  }
  const isToday = v => { const md = parseMD(v), n = new Date(); return !!md && md[0] === n.getMonth()+1 && md[1] === n.getDate(); };
  const todayMD = () => { const n = new Date(); return (n.getMonth()+1) + "/" + n.getDate(); };
  // 입원한 날 = HD#0, 수술한 날 = OP day, 다음 날부터 POD#1 (수술 예정이면 OP D-1)
  const hdOf  = o => { const d = daysAgo(o.adm); return d === null ? "" : "HD#" + d; };
  const podOf = o => { const d = daysDiff(o.op); return d === null ? "" : d === 0 ? "OP day" : d > 0 ? "POD#" + d : "OP D" + d; };
  const addDays = (v, n) => { const d = daysDiff(v); if (d === null) return ""; const t = new Date(); t.setHours(0,0,0,0); t.setDate(t.getDate() - d + n); return (t.getMonth() + 1) + "/" + t.getDate(); };
  // 자동 할 일 (auto: "op" | "patch"): 지워도 되고, 해당 칸을 다시 고치면 새로 생김
  function syncAutoTodo(o, key, text){
    o.todo = (o.todo || []).filter(r => r.auto !== key);
    if (text) o.todo.push({ t:text, auto:key });
  }
  function opTodoText(o){
    const d = daysDiff(o.op);
    if (d !== null && d > 0) return "";                                  // 이미 지난 수술
    if (!str(o.optime) && !anesList(o).length) return "";
    const an = anesList(o).join("+");                                    // 13:30 G/A · 11/8 09:00 OP · OP G/A
    return [d !== null && d < 0 ? fmtMD(o.op) : "", str(o.optime) || (an ? "OP" : ""), an || "OP"].filter(Boolean).join(" ");
  }
  function patchTodoText(o){
    const ty = patType(o); if (!ty || !str(o.patd)) return "";
    const d = daysAgo(o.patd); if (d === null) return "";
    return d >= PATCH_DAYS[ty] ? `${ty} 교체` : `${ty} 교체 ${addDays(o.patd, PATCH_DAYS[ty])}`;
  }
  const patchDue = o => { const ty = patType(o), d = daysAgo(o.patd); return !!ty && d !== null && d >= PATCH_DAYS[ty]; };
  const isIV  = l => /^\s*iv\s*$/i.test(l.t || "");
  /* 라인·튜브 종류별 사정 항목: [키, 라벨, 선택지(있으면 버튼), 전체탭 표시 형식]
     전체탭 태그엔 fmt 있는 것만 짧게 (부위·성상 등은 개별탭에만) */
  const LF = {
    s:   ["s",   "부위"],
    sd:  ["sd",  "부위",   ["Rt","Lt"]],
    lb:  ["lb",  "",       ["arm","leg"]],
    g:   ["g",   "G",      ["18","20","22","24"], v => v],
    fr:  ["fr",  "Fr",     null, v => v],
    way: ["way", "way",    ["2","3"], v => v],
    cm:  ["cm",  "고정 cm", null, v => v],
    nos: ["nos", "비공",   ["Rt","Lt"]],
    cc:  ["cc",  "배액 cc", null, v => v],
    col: ["col", "성상"],
    suc: ["suc", "suction"],
    lu:  ["lu",  "lumen",  ["1","2","3"]],
    ext: ["ext", "외부 cm", null, v => v],
    memo:["memo","메모"],
  };
  const LINE_TYPES = {
    "IV":         ["sd","lb","g"],
    "PICC":       ["sd","lu"],
    "C-line":     ["sd","lu"],
    "A-line":     ["sd"],
    "chemoport":  ["sd"],
    "AVF":        ["sd"],
    "Foley":      ["fr","way"],
    "L-tube":     ["fr","cm","nos"],
    "Hemovac":    ["s","cc","col"],
    "JP":         ["s","cc","col"],
    "PCD":        ["s","fr","cc","col"],
    "chest tube": ["s","fr","cc","col","suc"],
  };
  const lineType = l => Object.keys(LINE_TYPES).find(k => k.toLowerCase() === str(l.t).toLowerCase());
  const lineFields = l => (LINE_TYPES[lineType(l)] || ["s","memo"]).map(k => LF[k]);
  // 전체탭: 단위 없이 점으로 이어 짧게 (Foley 16.2, L-tube 16.60, IV 20, Hemovac 120)
  const lineSummary = l => lineFields(l).filter(f => f[3] && str(l[f[0]])).map(f => f[3](str(l[f[0]]))).join(".");
  const lineDays = l => daysAgo(l.d);

  /* ── 이전 버전(v1) 데이터 → 새 형식 ── */
  function htmlText(h){
    if (!h) return "";
    const d = document.createElement("div"); d.innerHTML = String(h).replace(/<br\s*\/?>/gi, " ");
    return d.textContent.replace(/ /g, " ").trim();
  }
  function migrate(o){
    o = (o && typeof o === "object") ? o : {};
    const n = {};
    ["io","defe","bp","hr","bpr","s","rr","lab","ua","ekg","rad","b","bn","m","dc","dcd","name","med"].forEach(k => { if (o[k] != null) n[k] = o[k]; });
    if (o.cc) n.dx = o.cc;
    if (o.iv) n.lines = [{ t:"IV", d:o.iv }];
    if (o.o2l) n.o2 = (o.o2n ? o.o2n : "") + "L";
    const todos = [].concat(o.todo || [], o.htodo || [], o.htodo2 || [])
      .map(r => typeof r === "string" ? { t:htmlText(r) } : { t:htmlText(r && r.t), c:r && r.c ? 1 : 0 });
    if (todos.length) n.todo = todos;
    if (Array.isArray(o.cons)) n.cons = o.cons.map(r => ({ t:htmlText(r && r.t), r:htmlText(r && r.r) }));
    return n;
  }

  /* ════════════ 전체 인계장 (A4) ════════════ */
  // V/S 칸은 전체탭에서도 눌러서 형광펜 켜고 끔 (q 간격·SpO2·BST도)
  function vsTpl(o){
    const vl = (l, k) => `<span class="vsl qt${o[k] ? " hl" : ""}" data-qt="${k}"${o[k] && o.vsc && COLOR_RE.test(o.vsc[k]) ? ` style="background:${o.vsc[k]}"` : ""}><i>${l}</i></span>`;
    const q = +o.vsq && +o.vsq !== 8 ? `<span class="vsq qt" data-qt="vsq">q${+o.vsq}hr</span>` : `<span class="vsq qt xoff" data-qt="vsq">q8</span>`;
    const mm = `<span class="qt vsm${o.m ? "" : " xoff"}" data-qt="m">M</span>`;
    return `<span class="vstpl">${q}${mm}${vl("SBP","bp")}/${vl("DBP","bp")}-${vl("HR","hr")}-${vl("RR","rr")}-${vl("BT","bpr")}`
      + (o.s ? `-(${vl("SpO2","s")})` : `<span class="qt xoff" data-qt="s">-(SpO2)</span>`)
      + (o.b ? ` [${vl("BST" + (str(o.bn) ? " " + esc(str(o.bn)) : ""), "b")}]` : ` <span class="qt xoff" data-qt="b">[BST]</span>`) + `</span>`;
  }
  // 알러지·격리 + 쓰는 약만 (안 쓰는 약은 전체탭에 아예 안 나옴 — 약은 개별탭에서 켬)
  function riskMedHTML(o){
    const t = (s, hi) => `<span class="t${hi ? " hi" : ""}">${esc(s)}</span>`;
    let h = "";
    if (str(o.allergy)) h += t(str(o.allergy) + " 알러지", 1);
    if (o.asv) h += t(o.asv + " arm save", 1);
    h += RISKS.filter(([k]) => o[k]).map(([k, l]) => `<span class="t hi qt" data-qt="${k}">${l}</span>`).join("");
    const it = isoTypes(o);
    if (it.length) h += t(it.join("·"), 1);
    else if (str(o.iso)) h += t(str(o.iso) + " 격리", 1);
    const fl = flList(o).filter(x => x !== "none");
    if (fl.length) h += `<span class="medc fl">${esc(fl.join("·"))}</span>`;
    MED_TYPES.forEach(ty => {
      const a = (o.med && Array.isArray(o.med[ty])) ? o.med[ty] : [];
      const nm = (o.medn || {})[ty] || [];
      a.forEach((v, k) => { if (+v > 0 && +v <= 3) h += `<span class="medc m${+v}${MED_HIGH.includes(ty) ? " hi" : ""}" data-med="${esc(ty)}:${k}">${esc(ty)}${nm[k] ? "(" + esc(nm[k]) + ")" : ""}</span>`; });
    });
    (o.medx || []).forEach((r, j) => { if (+r.v > 0 && +r.v <= 3) h += `<span class="medc m${+r.v}" data-mx="${j}">${esc(r.t)}</span>`; });
    const pca = +o.pca || 0;
    if (pca) h += `<span class="medc pca p${pca}" data-pca="1">${["","iv PCA","epi PCA"][pca]}${o.pcas === "clamp" ? " clamp" : ""}</span>`;
    if (patType(o)){ const d = daysAgo(o.patd);
      h += `<span class="medc pat${patchDue(o) ? " due" : ""}" data-pat="1">${patType(o)}${d !== null ? " D" + d : ""}</span>`; }
    return h;
  }
  function tagsHTML(o){
    const t = (s, hi) => `<span class="t${hi ? " hi" : ""}">${esc(s)}</span>`;
    let h = "";
    const dt = dietText(o);
    if (dt) h += t(dt, o.dietb === "NPO" || /npo/i.test(o.diet || ""));
    h += `<span class="t${str(o.o2) ? "" : " xoff"}" data-o2="1">O2${str(o.o2) ? " " + esc(str(o.o2)) : ""}</span>`;   // 누르면 2L → 1L → 직접 입력 → 끔
    (o.lines || []).filter(l => str(l.t)).forEach(l => {
      const d = lineDays(l);
      const sm = lineSummary(l);
      h += t([str(l.sd), str(l.lb), str(l.t)].filter(Boolean).join(" ") + (sm ? " " + sm : "") + (d !== null ? " D" + d : ""), isIV(l) && d !== null && d >= IV_DUE);
    });
    if (o.sore) (o.sores || []).filter(r => str(r.s)).forEach(r => h += t(soreText(r)));
    (o.dr || []).filter(r => str(r.s)).forEach(r => h += t(str(r.s) + " dx"));
    const pt = ptList(o);
    if (pt.length) h += t(pt.map(x => x + (PT_TIME[x] && str(o[PT_TIME[x]]) ? " " + str(o[PT_TIME[x]]) : "")).join(", "));
    const aids = o.aids || [];
    h += aids.length ? `<span class="t" data-aidpick="1">${esc(aids.map(aidText).join(", "))}</span>`
                     : `<span class="t xoff" data-aidpick="1">+보조기</span>`;
    return h;
  }
  // V/S 외 토글: 자리 고정(I/O defe | L U E R | m), 꺼진 건 화면에만 흐리게 → 전체탭에서 바로 눌러 켬
  const QT_GROUPS = [["io","defe"], ["lab","ua","ekg","rad","sp","st","nd","ac","bw"]];
  const tgLabel = k => (TOGGLES.find(x => x && x[0] === k) || [k, k])[1];
  const togglesHTML = o => QT_GROUPS.map(g => g.map(k => `<span class="qt${o[k] ? "" : " xoff"}" data-qt="${k}">${tgLabel(k)}</span>`).join("")).join(`<span class="sep"></span>`);
  function blockHTML(o, i){
    const dc = +o.dc || 0;
    const dcTxt = dc ? `<span class="dc${dc === 2 ? " big" : ""}">${esc(fmtMD(o.dcd))}${wdayOf(o.dcd)} <b>d/c</b></span>` : "";
    const as = str(o.age) + (o.sex ? "/" + o.sex : "");
    const sa = [o.sex, str(o.age)].filter(Boolean).join("/");
    const sub = [esc(sa), esc((o.dept || "") + (o.dept ? str(o.dno) : ""))].filter(Boolean).join(" · ");
    const sub2 = hdOf(o);                                                    // HD#3
    const sub3 = [podOf(o), esc(anesList(o).join("+"))].filter(Boolean).join(" ");   // OP day G/A (줄이 길어 따로)
    const name = str(o.name) ? esc(o.name) : `<span class="ph">${filled(o) ? "이름" : "+"}</span>`;
    const items = [];
    (o.todo || []).forEach((r, j) => { if (str(r.t)) items.push(`<span class="ti${r.c ? " done" : ""}" data-ti="${j}"><span style="${todoStyle(r)}">${esc(r.t)}</span><span class="ck" data-tck="${j}">${r.c ? "(+)" : "(   )"}</span></span>`); });
    if (str(o.exam)) items.push(`<span class="ti" data-ex="1"><span style="${todoStyle(o.exs || {})}"><b>검)</b> ${esc(o.exam).replace(/\n/g, " / ")}</span></span>`);
    (o.cons || []).forEach((r, j) => { if (str(r.t) || str(r.r)) items.push(`<span class="ti" data-cs="${j}"><span style="${todoStyle(r)}"><b>${esc(r.t)}</b>▶${esc(r.r)}</span></span>`); });
    return `<tr data-i="${i}">
      <td class="c-name${dc === 2 ? " dctoday" : ""}">
        <span class="draghandle" data-i="${i}" title="드래그해서 순서 변경">≡</span>
        <svg class="dcslash" viewBox="0 0 100 100" preserveAspectRatio="none"><line x1="0" y1="100" x2="100" y2="0"/></svg>
        <div class="nmbox">
          <div class="nm-top"><span class="bed">${esc(o.bed || "")}</span>${dcTxt}</div>
          <div class="nm-name${dc === 2 ? " struck" : ""}" data-nm="${i}">${name}</div>
          <div class="nm-sub">${sub}</div>${sub2 ? `<div class="nm-sub">${sub2}</div>` : ""}${sub3 ? `<div class="nm-sub">${sub3}</div>` : ""}
        </div>
      </td>
      <td class="c-sum"><div class="sumbox">
        <div class="ln ln1">${str(o.dx) ? esc(o.dx).replace(/\n/g, " / ") : ""}${pmhText(o) ? ` <small>(${esc(pmhText(o))})</small>` : ""}${sxSummary(o) ? `<span class="co">${esc(sxSummary(o))}</span>` : ""}</div>
        <div class="ln ln2">${riskMedHTML(o)}</div>
        <div class="ln ln2b">${tagsHTML(o)}</div>
        <div class="ln ln3"><span class="tgs">${togglesHTML(o)}</span></div>
        <div class="ln ln4">${vsTpl(o)}</div>
      </div></td>
      <td class="c-todo"><div class="todobox">${items.join("")}<span class="tadd" data-tadd="1" title="할 일 추가">+</span></div></td>
    </tr>`;
  }
  // 한 줄: 가로로 넘치면 폰트 축소 / 여러 줄: 세로로 넘치면 축소
  function fitWidth(el, base, min){
    let fs = base, g = 0; el.style.fontSize = fs + "pt";
    while (el.scrollWidth > el.clientWidth + 1 && fs > min && g++ < 20){ fs -= 0.5; el.style.fontSize = fs + "pt"; }
  }
  function fitHeight(el, base, min){
    let fs = base, g = 0; el.style.fontSize = fs + "pt";
    const over = () => el.scrollHeight > el.clientHeight + 1 || [...el.children].some(c => c.offsetWidth > el.clientWidth);
    while (over() && fs > min && g++ < 20){ fs -= 0.5; el.style.fontSize = fs + "pt"; }
  }
  function renderSheet(){
    const wi = wardItems();
    const wrow = wi.length ? `<tr class="wrow"><td colspan="3"><div class="wbox"><span class="wl">병동 공통</span>${wi.map(r =>
      `<span class="ti${r.c ? " done" : ""}">${esc(r.t)}<span class="ck">${r.c ? "(+)" : "(\u00a0\u00a0\u00a0)"}</span></span>`).join("")}</div></td></tr>` : "";
    // 13명 이하 1장, 넘으면 2장에 반씩 (공통 줄은 1장 맨 위)
    const n1 = count <= PER_PAGE ? count : Math.ceil(count / 2);
    const pages = count <= PER_PAGE ? [[0, count]] : [[0, n1], [n1, count]];
    P.forEach(normPatient);
    $("#sheets").innerHTML = pages.map(([a, z], pg) => `<div class="sheet"><table class="form">
        <colgroup><col style="width:2.4cm"><col style="width:6.9cm"><col style="width:7.46cm"></colgroup>
        <tbody>${pg === 0 ? wrow : ""}${P.slice(a, z).map((o, k) => blockHTML(o, a + k)).join("")}</tbody></table></div>`).join("");
    // 장마다 인원 수에 맞춰 블록 높이를 늘려 꽉 채움 (정수 px: 반올림 누적으로 페이지 넘김 방지)
    // 공통 줄이 있으면 그만큼 1장 환자 칸을 줄여서 1장 유지
    const usablePx = Math.floor(USABLE_CM * PX_CM) - 2;
    const wH = wi.length ? Math.round(0.75 * PX_CM) : 0;
    pages.forEach(([a, z], pg) => {
      const per = Math.min(Math.floor(MAX_BLK_CM * PX_CM), Math.floor((usablePx - (pg === 0 ? wH : 0)) / (z - a)));
      for (let i = a; i < z; i++){
        const tr = document.querySelector(`#sheets tr[data-i="${i}"]`);
        tr.style.height = per + "px";
        tr.querySelectorAll("td > div").forEach(d => d.style.height = (per - 1) + "px");
      }
    });
    const wr = $("#sheets tr.wrow");
    if (wr){ wr.style.height = wH + "px"; wr.querySelector(".wbox").style.height = (wH - 1) + "px"; fitHeight(wr.querySelector(".wbox"), 8, 5); }
    document.querySelectorAll("#sheets .nm-name").forEach(el => fitWidth(el, 10.5, 6));
    document.querySelectorAll("#sheets .nm-top").forEach(el => fitWidth(el, 7, 5));
    document.querySelectorAll("#sheets .nm-sub").forEach(el => fitWidth(el, 7, 5));
    document.querySelectorAll("#sheets .ln1").forEach(el => fitWidth(el, 9, 5.5));
    document.querySelectorAll("#sheets .ln2").forEach(el => fitHeight(el, 7.5, 5));
    document.querySelectorAll("#sheets .ln2b").forEach(el => fitHeight(el, 7.5, 5));
    document.querySelectorAll("#sheets .ln3").forEach(el => fitWidth(el, 7.5, 5));
    document.querySelectorAll("#sheets .ln4").forEach(el => fitWidth(el, 8, 5));
    document.querySelectorAll("#sheets .todobox").forEach(el => fitHeight(el, 8, 5));
    // 각 줄 오른쪽(종이 밖)에 간호기록 버튼
    document.querySelectorAll("#sheets .sheet").forEach(sh => {
      const col = document.createElement("div"); col.className = "chartcol";
      sh.querySelectorAll("tr[data-i]").forEach(tr => {
        const i = +tr.dataset.i; if (!filled(P[i])) return;
        const b = document.createElement("button"); b.className = "chartbtn"; b.dataset.chart = i; b.textContent = "간호기록";
        b.style.top = (tr.offsetTop + tr.offsetHeight / 2) + "px";
        col.appendChild(b);
      });
      sh.appendChild(col);
    });
    $("#cntLabel").textContent = count + "명";
    scaleToFit();
    refreshOut();
    if (tvOn) renderTv();
  }

  /* ── 전체 인계장: 칸 누르면 개별 인계장 / ≡ 드래그로 순서 변경 ── */
  $("#sheets").addEventListener("click", e => {
    const cb = e.target.closest("[data-chart]"); if (cb){ copyChart(+cb.dataset.chart); return; }
    if (e.target.closest(".draghandle")) return;
    if (e.target.closest("tr.wrow")){ openTv(); return; }
    const tr = e.target.closest("tr[data-i]"); if (!tr) return;

  function rerenderEd(focusId){
    const a = document.activeElement;
    const id = focusId || (a && a.id && $("#edCard").contains(a) ? a.id : null);
    let pos = null;
    if (!focusId && a && $("#edCard").contains(a)) try { if (a.selectionStart != null) pos = [a.selectionStart, a.selectionEnd]; } catch(_){}
    renderEd();
    const el = id && document.getElementById(id);
    if (el){ el.focus({ preventScroll:true }); if (pos) try { el.setSelectionRange(pos[0], pos[1]); } catch(_){} }
    refreshOut();
  }

  // 입력 → 데이터만 갱신 (입력칸은 다시 안 그림: 한글 IME 안전)

    const t = e.target, o = cur();
    if (t.tagName === "TEXTAREA") autoGrow(t);
    if (t.id === "pmhq"){ renderPmhDrop(t.value); return; }               // 검색만, 데이터는 고를 때
    if (t.dataset.f){
      const f = t.dataset.f;
      o[f] = t.value;

      if (f === "op")  $("#calc-pod").textContent = podOf(o);
      if (f === "patd"){ const c = $("#calc-pat"); if (c) c.innerHTML = patCalc(o); }
      if (f === "dcd"){                         // 날짜가 오늘이면 퇴원 확정, 아니면 예정
        $("#calc-wd").textContent = wdayOf(o.dcd);

      }
      if (f === "name" || f === "bed") renderNav();
    } else if (t.dataset.sxd){
      o.sxd = o.sxd || {}; o.sxd[t.dataset.sxd] = t.value;
    } else if (t.dataset.list){

  (function bindRowDrag(){
    const box = $("#edCard");

    const clear = () => box.querySelectorAll(".drop-before,.drop-after").forEach(r => r.classList.remove("drop-before", "drop-after"));
    const target = y => {
      for (const r of drag.rows){ const b = r.getBoundingClientRect(); if (y < b.bottom) return { r, before: y < (b.top + b.bottom) / 2 }; }
      const last = drag.rows[drag.rows.length - 1]; return { r:last, before:false };
    };

      const h = e.target.closest(".dh"); if (!h) return;

      try { h.setPointerCapture(e.pointerId); } catch(_){}
    });
    box.addEventListener("pointermove", e => {
      if (!drag) return; clear();
      const t = target(e.clientY); t.r.classList.add(t.before ? "drop-before" : "drop-after");
    });
    const end = e => {
      if (!drag) return;
      const t = target(e.clientY), d = drag; drag = null; clear();
      let to = +t.r.dataset.di + (t.before ? 0 : 1); if (d.from < to) to--;
      if (to === d.from) return;

    box.addEventListener("pointercancel", () => { drag = null; clear(); });
  })();

    lines.filter(l => !isIV(l) && !isDrainNP(l) && !/^(pcd|chest tube)$/i.test(str(l.t)) && !(o.dept === "URO" && /^foley$/i.test(str(l.t))))
      .forEach(l => L.push(tubeLine(l)));
    if (o.sore) (o.sores || []).filter(r => str(r.s)).forEach(r => L.push(`${soreText(r)} site dx kept.`));
    (o.dr || []).map(r => str(r.s).replace(/[.\s]+$/, "")).filter(Boolean).forEach(t => L.push(`${t} site dx kept.`));
    if (lateIPC) push(...aesIpc());
    if (aids.some(a => a.t === "air matt")) L.push("air matt kept.");
    if (o.sore || o.rest || /bed\s*ridden/i.test(str(o.act))) L.push("position change, back care done.");   // 욕창 · 보호대 · bed ridden
    if (isoTypes(o).length) L.push([str(o.iso), isoTypes(o).map(x => ISO_CHART[x]).join(", "), "적용 중."].filter(Boolean).join(" "));
    else if (str(o.iso)) L.push(isoLine(str(o.iso)));
    const fl = flList(o);                                              // TPN도 '수액'으로, 안 고르면 Fluid
    if (!fl.includes("none")){
      if (!fl.length || fl.includes("Fluid") || fl.includes("TPN")) L.push("처방 수액 점적 중.");
      if (fl.includes("acting")) L.push("IV acting state.");
    }
    const adl = ["환의 교체", "개인위생"];
    if (brain && o.nss && o.mpg !== undefined && o.mpg !== "" && +o.mpg < 5) adl.push("배변", "배뇨", "침상 밖 이동");   // 편마비 등 (식이섭취는 자동으로 안 넣음)
    else if (mainAids.length && region === "leg") adl.push("배변", "배뇨", "침상 밖 이동");
    if (lines.some(l => /^foley$/i.test(str(l.t))) && !adl.includes("배변")) adl.push("배변", "배뇨");
    L.push(adl.join(", ") + " 도움 줌.");
    if (o.fall) L.push("낙상 고위험군, side rail up state.");
    if (o.asv) L.push(`${o.asv} arm save state.`);
    if (o.rest){                                                       // 신체보호대: 사유 고정 + 부위
      const site = restraintSite(o);
      L.push(`도관 제거 가능성 있어 ${site ? site + " " : ""}restraint kept.`,
             "- q2hr restraint site check & 10min release.",
             "- restraint site skin : clear, C/M/S(+/+/+).");
    }
    L.push("불편감 알리도록 함.");
    return L.join("\n").replace(/\.\s+(?=\S)/g, ".\n");
  }
  async function copyChart(i){
    const o = P[i]; if (!filled(o)){ toast("빈 칸이에요"); return; }
    const txt = chartFor(o);
    try { await navigator.clipboard.writeText(txt); }
    catch {
      const ta = document.createElement("textarea"); ta.value = txt; ta.style.position = "fixed"; ta.style.opacity = "0";
      document.body.appendChild(ta); ta.select(); try { document.execCommand("copy"); } catch(_){} ta.remove();
    }
    toast(`간호기록 복사됨 — ${str(o.name) || (i + 1) + "번"}`);
  }

  let pending = null;
  function applyStr(raw){
    pending = null;
    const txt = String(raw || "").trim();
    if (!txt){ syncMsg("붙여넣은 코드나 파일 내용이 없어요.", "err"); return; }
    const code = extractCode(txt);
    let s, data;
    try { s = decode(code); data = JSON.parse(s); }
    catch {
      syncMsg(code.startsWith("HND1:")
        ? "코드를 읽을 수 없어요. <b>코드가 중간에 잘렸을</b> 가능성이 커요.<br>카톡이면 메시지의 <b>전체보기</b>를 열고 전부 복사하거나, <b>.txt로 저장</b>한 파일을 보내서 <b>파일 열기</b>로 불러오세요."
        : "인계장 코드가 아니에요. <b>HND1:</b> 로 시작하는 코드를 붙여넣어 주세요.", "err");
      return;
    }
    let list = data && Array.isArray(data.p) ? data.p : (Array.isArray(data) ? data : null);
    if (!list){ syncMsg("인계장 데이터를 찾을 수 없어요.", "err"); return; }
    list = list.map(o => (o && typeof o === "object") ? o : {});
    if (data.v !== 2) list = list.map(migrate);          // 이전 버전 코드 → 새 형식
    list.forEach(normDept); list.forEach(normPatient);
    const n = list.filter(filled).length;
    pending = { data, list };
    syncMsg(`불러온 데이터: <b>${n}명</b> 기재${Array.isArray(data.w) && data.w.length ? ", 병동 공통 할 일 있음" : ""}. 지금 화면을 덮어쓸까요?
      <div class="row"><button class="go" id="syncGo">덮어쓰기</button><button id="syncNo">취소</button></div>`);
    $("#syncGo").addEventListener("click", commitApply);
    $("#syncNo").addEventListener("click", () => { pending = null; syncMsg(""); });
  }
  function commitApply(){
    if (!pending) return;
    const { data, list } = pending; pending = null;
    try {
      count = Math.min(MAX, Math.max(1, Math.floor(+data.n) || list.length || DEFAULT_COUNT));
      P = Array.from({ length:count }, (_, i) => list[i] || {});
      W = Array.isArray(data.w) ? data.w.filter(r => r && typeof r === "object") : [];
      if (pvOn){ const f = P.findIndex(filled); edIdx = f >= 0 ? f : 0; renderEd(); }
      renderTv();
      renderSheet();
      syncMsg(""); $("#sync-in").value = "";
      $("#syncpanel").classList.remove("open");
      toast(`불러왔어요 (${list.filter(filled).length}명)`);
    } catch (err){
      syncMsg("불러오는 중 오류가 났어요: " + esc(err && err.message || err) + "<br>이 문구를 캡처해서 알려주세요.", "err");
    }
  }

  /* ════════════ 툴바 ════════════ */
  $("#plus").addEventListener("click", () => { if (count < MAX){ count++; P.push({}); renderSheet(); if (pvOn) renderNav(); } });
  $("#minus").addEventListener("click", () => {
    if (count <= 1) return;
    if (filled(P[count-1]) && !confirm("마지막 칸에 적힌 내용이 지워져요. 계속할까요?")) return;
    count--; P.pop();
    if (edIdx >= count) edIdx = count - 1;
    renderSheet(); if (pvOn) renderEd();
  });
  const prePrint  = () => { document.body.classList.add("printing"); renderSheet(); };
  const postPrint = () => { document.body.classList.remove("printing"); renderSheet(); };
  $("#printBtn").addEventListener("click", () => { prePrint(); window.print(); });
  window.addEventListener("beforeprint", prePrint);
  window.addEventListener("afterprint", postPrint);
  $("#clearBtn").addEventListener("click", () => {
    if (anyData() && !confirm("전체 내용을 지울까요? 되돌릴 수 없어요.")) return;
    P = Array.from({ length:count }, () => ({})); W = []; edIdx = 0;
    renderTv();
    renderSheet(); if (pvOn) renderEd();
  });
  $("#syncBtn").addEventListener("click", () => {
    const p = $("#syncpanel");
    if (p.classList.contains("open")){ p.classList.remove("open"); return; }
    $("#sync-out").value = encode(exportStr()); $("#sync-in").value = ""; syncMsg(""); pending = null; p.classList.add("open");
  });
  $("#syncCopy").addEventListener("click", async () => {
    const el = $("#sync-out");
    try { await navigator.clipboard.writeText(el.value); } catch { el.select(); document.execCommand("copy"); }
    flash($("#syncCopy"), "복사됨!");
  });
  $("#syncSave").addEventListener("click", () => {
    const blob = new Blob([encode(exportStr())], { type:"text/plain" });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    const n = new Date(), p2 = x => String(x).padStart(2, "0");   // 로컬 날짜 (toISOString은 UTC라 09시 전엔 전날)
    a.download = `handoff-${n.getFullYear()}-${p2(n.getMonth()+1)}-${p2(n.getDate())}.txt`;
    a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  });
  $("#syncApply").addEventListener("click", () => applyStr($("#sync-in").value));
  $("#syncOpen").addEventListener("click", () => $("#syncFile").click());
  $("#syncFile").addEventListener("change", e => {
    const f = e.target.files[0]; if (!f) return;
    const rd = new FileReader(); rd.onload = () => applyStr(rd.result); rd.readAsText(f);
    e.target.value = "";
  });

  /* ── 폰에서 가로폭 맞추기 (인쇄엔 영향 없음) ── */
  function scaleToFit(){
    const sheets = [...document.querySelectorAll(".sheet")];
    sheets.forEach(sh => { sh.style.transform = "none"; sh.style.marginBottom = ""; });
    const box = $("#sheets").clientWidth - 28 - 4;     // stage 좌우 padding 제외
    const COL = 80;                                     // 오른쪽 간호기록 버튼 자리 (화면 기준 px)
    sheets.forEach(sh => {
      const w = sh.offsetWidth;
      const sc = box > 0 ? Math.min(1, (box - COL) / w) : 1;
      const shift = (box - w * sc) / 2 < COL ? -COL / 2 : 0;   // 버튼이 화면 밖으로 나가면 종이를 왼쪽으로
      sh.style.transform = sc < 1 || shift ? `translateX(${shift}px) scale(${sc})` : "none";
      if (sc < 1) sh.style.marginBottom = (sh.offsetHeight * (sc - 1)) + "px";
      const col = sh.querySelector(".chartcol");        // 버튼은 축소 안 되게 되돌림
      if (col){ col.style.width = (COL / sc) + "px"; col.querySelectorAll(".chartbtn").forEach(b => { b.style.transform = `translateY(-50%) scale(${1 / sc})`; b.style.left = (6 / sc) + "px"; }); }
    });
  }
  window.addEventListener("resize", () => { if (!pvOn) scaleToFit(); });

  /* ── 실수로 닫기 방지 (저장은 안 함) ── */
  window.addEventListener("beforeunload", e => { if (anyData()){ e.preventDefault(); e.returnValue = ""; } });

  renderSheet();

  if ("serviceWorker" in navigator)
    window.addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(()=>{}));
})();
</script>
</body>
</html>
