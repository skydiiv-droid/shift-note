<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#334155">
<title>인계장</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="인계장">
<style>
  :root{
    --ink:#000;
    --line:0.5pt solid #000;
    --guide:#e2e8f0;
    --ph:#cbd5e1;
    --fs-name:9.5pt;
    --fs-cell:9pt;
    --fs-memo:8.5pt;
    --fs-mini:7.5pt;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:#f1f5f9;
    font-family:'맑은 고딕','Malgun Gothic','Apple SD Gothic Neo',sans-serif;
    color:#0f172a;
    -webkit-text-size-adjust:100%;
  }

  /* ───────── 툴바 ───────── */
  .bar{
    position:sticky; top:0; z-index:20;
    background:#334155; color:#fff;
    padding:8px 10px;
    display:flex; flex-wrap:wrap; gap:6px; align-items:center;
    box-shadow:0 1px 4px rgba(0,0,0,.25);
  }
  .bar b{font-size:14px; margin-right:4px; letter-spacing:.5px}
  .bar button{
    font:inherit; font-size:13px;
    background:#475569; color:#fff; border:0; border-radius:6px;
    padding:6px 10px; cursor:pointer; white-space:nowrap;
  }
  .bar button:hover{background:#64748b}
  .bar button.primary{background:#0ea5e9}
  .bar button.primary:hover{background:#38bdf8}
  .bar button.danger{background:#9f1239}
  .bar button.danger:hover{background:#be123c}
  .cnt{display:flex; align-items:center; gap:4px; background:#475569; border-radius:6px; padding:2px 4px}
  .cnt button{padding:3px 9px; background:transparent; font-size:15px; line-height:1}
  .cnt span{font-size:13px; min-width:56px; text-align:center}
  .sp{flex:1}
  .hint{font-size:11px; color:#cbd5e1; width:100%; margin-top:2px}

  /* ───────── 연동 패널 ───────── */
  .sync{display:none; background:#1e293b; color:#e2e8f0; padding:10px; gap:8px; flex-direction:column}
  .sync.open{display:flex}
  .sync .row{display:flex; gap:6px; align-items:center; flex-wrap:wrap}
  .sync label{font-size:12px; color:#94a3b8; width:100%}
  .sync textarea{
    width:100%; height:58px; resize:vertical;
    font-family:ui-monospace,Menlo,Consolas,monospace; font-size:11px;
    border-radius:6px; border:1px solid #475569; background:#0f172a; color:#e2e8f0; padding:6px;
  }
  .sync button{
    font:inherit; font-size:12px; background:#475569; color:#fff;
    border:0; border-radius:6px; padding:5px 10px; cursor:pointer;
  }
  .sync button:hover{background:#64748b}

  /* ───────── 용지 ───────── */
  .stage{padding:14px; display:flex; justify-content:center}
  .sheet{
    width:17cm;
    background:#fff;
    box-shadow:0 2px 12px rgba(15,23,42,.18);
    padding:0;
    transform-origin:top center;
  }
  table.form{
    width:16.76cm; margin:0 auto; border-collapse:collapse;   /* 17cm→16.76: 인쇄 시 우측 잘림 방지 */
    table-layout:fixed;
  }
  table.form td{
    padding:0 1px; margin:0;
    vertical-align:middle;
    overflow:hidden;
    border:0;
  }

  /* 블록 테두리 — ODT 원본 규칙
     ※ 위 `table.form td{border:0}`보다 특이도가 높아야 해서 전부 table.form 접두사 유지 */
  table.form tr.r1 td{border-top:var(--line)}
  table.form tr.r3 td{border-bottom:var(--line)}
  table.form td.name{border:var(--line)}                      /* 이름칸 전체 박스 */
  table.form td.f{border-right:var(--line)}                   /* special V/S 우측 구분선 */
  table.form td.gut{border-top:var(--line);border-bottom:var(--line)}  /* 얇은 거터(rowspan 3) */

  /* 화면 전용 셀 가이드 */
  @media screen{
    table.form td{outline:1px dotted var(--guide); outline-offset:-1px}
    td.name{outline:0}
  }

  /* ───────── 입력 요소 ───────── */
  input.f{
    width:100%; border:0; background:transparent; outline:0;
    font-family:inherit; color:var(--ink);
    font-size:var(--fs-cell); padding:0 1px; margin:0;
    line-height:1.1;
  }
  input.f::placeholder{color:var(--ph)}
  input.f:focus{background:#e0f2fe}
  input.nm{font-size:var(--fs-name); text-align:center; font-weight:600}
  input.memo{font-size:var(--fs-memo)}
  input.mini{font-size:var(--fs-mini); text-align:center}
  input.ctr{text-align:center}

  /* 토글 (고정 라벨: 켜짐=인쇄됨) */
  .tg{
    display:block; width:100%; min-height:1.15em; text-align:center; cursor:pointer;
    font-size:var(--fs-cell); line-height:1.15;
    color:var(--ink); user-select:none; white-space:nowrap;
  }
  .tg.sm{font-size:var(--fs-mini)}
  .tg.off{color:var(--ph)}
  .tg:hover{background:#e0f2fe}
  .tg.al{text-align:left; padding-left:2px}    /* 좌측정렬 (가운데에 수치 손글씨) */
  .tg.ar{text-align:right; padding-right:2px}   /* 우측정렬 */

  .nmwrap{display:flex; flex-direction:column; justify-content:center; height:100%; gap:0.3em}
  .nmwrap .ccin{font-size:var(--fs-cell); text-align:center}   /* 상병/C.C. — 나머지와 동일 크기 */

  /* 순서변경 드래그 핸들 (인쇄 안 됨) */
  .iocell{position:relative}
  .draghandle{
    position:absolute; left:1px; top:0; bottom:0; z-index:6;
    display:flex; align-items:center;
    font-size:11px; line-height:1; color:#94a3b8; cursor:grab;
    padding:0 2px; user-select:none; touch-action:none;
  }
  .draghandle:hover{color:#0ea5e9}
  body.dragging, body.dragging *{cursor:grabbing !important; user-select:none}
  #rows tr.drop-target td{background:#e0f2fe}

  /* 분할 행 (I/O|defe, BP|HR|T, S|RR|L) */
  .vrow{display:flex; height:100%; align-items:stretch}
  .vrow .tg{flex:1; width:auto; display:flex; align-items:center; justify-content:center; min-height:0; padding:0}
  .vrow .tg + .tg, .vrow .tg + .lslot{border-left:var(--line)}
  .iocell .vrow{padding-left:11px}          /* 드래그 핸들 자리 */
  /* L 슬롯: 숫자 입력 + L (O2 유량) */
  .vrow .lslot{flex:1; min-width:0; display:flex; align-items:center; justify-content:center}
  .vrow .lslot .o2num{flex:1; min-width:0; text-align:right; padding-right:1px}
  .vrow .lslot .tg{flex:0 0 auto; width:auto; display:inline}

  /* IV: P C 토글 + 날짜 입력 */
  .ivwrap{display:flex; align-items:center; width:100%; gap:1px}
  .ivwrap .tg{flex:0 0 auto; width:auto; padding:0 1px}
  .ivwrap .iv{flex:1; min-width:0}

  /* 이름 밑 d/c 줄: 날짜 입력 + 요일 + d/c */
  .dcrow{display:flex; align-items:baseline; width:100%}
  .dcrow .dcdate{width:2.9em; min-width:0; text-align:right; font-size:var(--fs-mini)}
  .dcrow .dcwday{flex:0 0 auto; font-size:var(--fs-mini); color:var(--ink); white-space:nowrap}
  .dcrow .tg{margin-left:auto; flex:0 0 auto; width:auto}

  /* B* + 숫자 */
  .bwrap{display:flex; align-items:center; height:100%}
  .bwrap .tg{flex:0 0 auto; width:auto; padding-left:2px}
  .bnum{flex:1; min-width:0; text-align:left; padding-left:1px}

  /* 정규 V/S 손글씨 템플릿 (SBP/DBP-HR-RR-BT-SpO2) — 각 칸에 흐린 가이드 라벨 */
  .vstpl{font-size:var(--fs-cell); white-space:nowrap; color:var(--ink); letter-spacing:0}
  .vsl{display:inline-block; min-width:0.58cm; text-align:center}
  .vsl i{font-style:normal; font-size:6pt; color:#c3ccd8}   /* 손글씨로 덮어써도 방해 안 될 만큼 흐리게 */
  .vspo2{display:none}
  .vs.son .vspo2{display:inline}

  /* ── 오른쪽 "할 일" 칸(3칸 병합) ───────────────────── */
  td.todo{vertical-align:top; padding:0}
  .todowrap{position:relative; height:100%; width:100%}

  /* 오른쪽 절반: 세로 할 일 (2열: 왼 vcL / 오 vcR, 크기는 JS가 지정) */
  .vzone{position:absolute; top:0; right:0; display:flex; gap:4px; align-items:flex-start}
  .vzone .todocol{flex:1; min-width:0; overflow:hidden; line-height:1.3; padding:2px 1px 0}
  .vzone .vcR{padding-top:16px}                 /* + 버튼 자리 */
  .vzone.wrapmode .todocol{line-height:1.5}
  .vzone.wrapmode .todoitem{align-items:flex-start; min-height:0}

  /* 왼쪽 위: 가로 할 일 / 왼쪽 중간: 협진 (둘 다 flex-wrap 가로 흐름) */
  .hzone{position:absolute; top:0; left:0; overflow:hidden}
  .czone{position:absolute; left:0; overflow:hidden}
  .hrow,.crow{display:flex; flex-wrap:wrap; align-content:flex-start; gap:0 5px; line-height:1.35; height:100%}
  .hrow{padding:16px 1px 0 2px}       /* 왼쪽 위 + 버튼 자리 */
  .crow{padding:1px 1px 0 16px}       /* 왼쪽 협진 + 버튼(왼쪽) 자리 */

  /* 항목 공통: [텍스트][마커] */
  .todoitem{display:flex; align-items:baseline; gap:2px; overflow:hidden; color:var(--ink); min-height:1.2em}
  .todoitem .ttext{outline:0; overflow:hidden; white-space:nowrap; word-break:break-all}
  .todoitem .ttext:focus{background:#e0f2fe}
  .tchk{flex:0 0 auto; cursor:pointer; user-select:none; color:var(--ink)}
  .tchk:hover{background:#e0f2fe}
  .tmark{flex:0 0 auto; color:var(--ink); user-select:none}   /* 협진 ▶ */
  /* 세로: 폭 꽉 채우고 우측정렬, 괄호는 오른쪽 */
  .vzone .todoitem{justify-content:flex-end}
  .vzone .todoitem .ttext{flex:1; min-width:0; text-align:right}
  /* 가로(할 일/협진): 내용만큼만, 좌측정렬 */
  .hrow .todoitem,.crow .todoitem{display:inline-flex; max-width:100%}
  .hrow .todoitem .ttext,.crow .todoitem .ttext{flex:0 1 auto; text-align:left}
  .crow .todoitem{gap:0}              /* ED▶ 붙여서 */

  /* 왼쪽 아래 V/S (축소) */
  td.todo .vs{position:absolute; left:0; display:flex; align-items:center; overflow:hidden}

  .todoadd{
    position:absolute; top:0; z-index:5;
    width:15px; height:15px; line-height:13px; text-align:center;
    border:1px solid #94a3b8; border-radius:50%;
    background:#fff; color:#475569; font-size:12px; cursor:pointer; user-select:none;
  }
  .todoadd:hover{background:#0ea5e9; color:#fff; border-color:#0ea5e9}

  /* 우클릭 서식 메뉴 */
  .ctxmenu{
    position:fixed; z-index:60; display:none;
    background:#1e293b; border:1px solid #475569; border-radius:8px;
    padding:6px; box-shadow:0 6px 20px rgba(0,0,0,.35);
  }
  .ctxmenu.open{display:block}
  .ctxmenu .cm-row{display:flex; gap:4px; margin:3px 0}
  .ctxmenu button{
    font:inherit; font-size:13px; line-height:1;
    min-width:28px; height:28px; padding:0 6px;
    border:1px solid #475569; border-radius:6px;
    background:#0f172a; color:#e2e8f0; cursor:pointer;
  }
  .ctxmenu button:hover{outline:2px solid #38bdf8}
  .ctxmenu .cm-colors button{font-weight:700; font-size:15px}

  /* ───────── 인쇄 ───────── */
  @page{ size:A4 portrait; margin:1.401cm 2cm; }
  @media print{
    body{background:#fff}
    .bar,.sync,.hint{display:none !important}
    .stage{padding:0; display:block}
    .sheet{width:17cm; box-shadow:none; transform:none !important}
    table.form td{outline:0 !important}
    .tg.off{color:transparent !important}
    input.f:focus{background:transparent}
    input.f::placeholder{color:transparent !important}
    .ctxmenu{display:none !important}
    .todoadd, .draghandle{display:none !important}
    .todoitem .ttext:focus{background:transparent}
    #rows tr.drop-target td{background:transparent !important}
    /* 형광펜·글씨색이 인쇄에도 그대로 나오게 */
    .sheet, .sheet *{ -webkit-print-color-adjust:exact; print-color-adjust:exact; }
    html,body{width:17cm}
  }
</style>
</head>
<body>

<div class="bar no-print">
  <b>인계장</b>
  <div class="cnt">
    <button id="minus" title="환자 수 줄이기">−</button>
    <span id="cntLabel">13명</span>
    <button id="plus" title="환자 수 늘리기">+</button>
  </div>
  <button id="printBtn" class="primary">인쇄</button>
  <button id="syncBtn">연동</button>
  <button id="clearBtn" class="danger">전체 지우기</button>
  <div class="sp"></div>
  <div class="hint">저장 안 됨 — 새로고침하면 다 날아가요. 옮기려면 <b>연동</b>으로 코드 복사.</div>
</div>

<div class="sync no-print" id="syncpanel">
  <label>내보내기 — 이 코드를 복사해서 다른 기기 인계장에 붙여넣으세요</label>
  <textarea id="sync-out" readonly></textarea>
  <div class="row">
    <button id="syncCopy">복사</button>
    <button id="syncSave">.txt로 저장</button>
  </div>
  <label>가져오기 — 코드를 붙여넣고 적용</label>
  <textarea id="sync-in" placeholder="HND1:..."></textarea>
  <div class="row">
    <button id="syncApply">적용</button>
    <button id="syncOpen">파일 열기</button>
    <input type="file" id="syncFile" accept=".txt,text/plain" style="display:none">
  </div>
</div>

<div class="stage">
  <div class="sheet" id="sheet">
    <table class="form">
      <colgroup>
        <col style="width:0.533cm"><col style="width:0.533cm"><col style="width:0.533cm"><col style="width:0.534cm">
        <col style="width:2.133cm">
        <col style="width:1.065cm"><col style="width:1.067cm">
        <col style="width:0.192cm">
        <col style="width:3.39cm"><col style="width:3.39cm"><col style="width:3.39cm">
      </colgroup>
      <tbody id="rows"></tbody>
    </table>
  </div>
</div>

<script>
(function(){
  "use strict";
  const $ = s => document.querySelector(s);

  const MAX = 13;
  const USABLE_CM = 29.7 - 1.401*2;   // 26.898cm
  const MIN_ROW_CM = 0.681;           // ODT 원본 행 높이
  const MAX_ROW_CM = 0.95;            // 인원 적을 때 과하게 늘어나지 않게
  let count = MAX;

  // 셀 키 목록 (가져오기/내보내기 순서 고정)
  const KEYS = ["io","defe","iv","p","c","lab","ua","ekg","rad","dcd","dc","name","cc","bp","hr","bpr","s","rr","o2l","o2n","b","bn","m",
                "todo","htodo","cons"];
  const WDAYS = ["일","월","화","수","목","금","토"];

  /* ── 한 환자 블록 3행 생성 ───────────────────────────── */
  function block(i){
    // 라벨은 항상 DOM에 있고, 표시 여부만 .off 로 제어 (비면 클릭 영역이 0이 됨)
    const tg  = (k,label,cls) =>
      `<span class="tg off ${cls||""}" data-k="${k}" data-label="${label}" data-i="${i}" title="${label}">${label}</span>`;
    const inp = (k,cls,ph,ml) =>
      `<input class="f ${cls||""}" data-k="${k}" data-i="${i}" placeholder="${ph||""}"${ml?` maxlength="${ml}"`:""}>`;
    // V/S 슬롯: 작고 흐린 가이드 라벨(손글씨로 덮어써도 되게)
    const vl = (lab) => `<span class="vsl"><i>${lab}</i></span>`;
    // 오른쪽 "할 일" 영역(메모 7칸 = colspan3 rowspan3 병합). 4개 구역:
    //  · vzone(오른쪽 절반): 세로 할 일(우측 + 버튼, 2열 우→좌)
    //  · hzone(왼쪽 위 ≈1.5칸): 가로 할 일(왼쪽 + 버튼, 괄호로 구분)
    //  · cons(왼쪽 중간, V/S 위): 협진 칸, 내용 있으면 우측에 ▶
    //  · vs(왼쪽 아래, 축소): V/S 손글씨 템플릿
    const todoCell =
      `<div class="todowrap" data-i="${i}">`
      +   `<div class="vzone" data-k="todo" data-i="${i}"><div class="todocol vcL"></div><div class="todocol vcR"></div></div>`
      +   `<span class="todoadd addV no-print" data-i="${i}" title="세로 할 일 추가">+</span>`
      +   `<div class="hzone"><div class="hrow" data-k="htodo" data-i="${i}"></div></div>`
      +   `<span class="todoadd addH no-print" data-i="${i}" title="가로 할 일 추가">+</span>`
      +   `<div class="czone"><div class="crow" data-k="cons" data-i="${i}"></div></div>`
      +   `<span class="todoadd addC no-print" data-i="${i}" title="협진 추가">+</span>`
      +   `<div class="vs" data-i="${i}" data-k="vs"><span class="vstpl">${vl("SBP")} /${vl("DBP")} -${vl("HR")} -${vl("RR")} -${vl("BT")}<span class="vspo2"> -(${vl("SpO2")})</span></span></div>`
      + `</div>`;

    return `
    <tr class="r1" data-i="${i}">
      <td colspan="4" class="a iocell">
        <span class="draghandle no-print" data-i="${i}" title="드래그해서 순서 변경">≡</span>
        <div class="vrow">${tg("io","I/O")}${tg("defe","defe")}</div>
      </td>
      <td rowspan="3" class="name">
        <div class="nmwrap">
          <div class="dcrow">${inp("dcd","dcdate","날짜",5)}<span class="dcwday" data-i="${i}"></span>${tg("dc","d/c","sm")}</div>
          ${inp("name","nm","이름")}
          ${inp("cc","ccin","C.C.")}
        </div>
      </td>
      <td colspan="2" class="f vitals"><div class="vrow">${tg("bp","BP")}${tg("hr","HR")}${tg("bpr","T")}</div></td>
      <td rowspan="3" class="gut"></td>
      <td colspan="3" rowspan="3" class="todo">${todoCell}</td>
    </tr>
    <tr class="r2" data-i="${i}">
      <td colspan="4" class="a ivcell"><div class="ivwrap">${tg("p","P")}${tg("c","C")}${inp("iv","ctr iv","IV일",5)}</div></td>
      <td colspan="2" class="f vitals"><div class="vrow">${tg("s","S")}${tg("rr","RR")}<span class="lslot">${inp("o2n","o2num","",3)}${tg("o2l","L")}</span></div></td>
    </tr>
    <tr class="r3" data-i="${i}">
      <td class="a">${tg("lab","L","sm")}</td>
      <td class="a">${tg("ua","U","sm")}</td>
      <td class="a">${tg("ekg","E","sm")}</td>
      <td class="a">${tg("rad","R","sm")}</td>
      <td class="e"><div class="bwrap">${tg("b","B*","al")}${inp("bn","bnum","",2)}</div></td>
      <td class="f">${tg("m","m","ar")}</td>
    </tr>`;
  }

  /* ── 렌더 ─────────────────────────────────────────────── */
  function render(keep){
    const data = keep ? collect() : null;
    let html = "";
    for (let i=0;i<count;i++) html += block(i);
    $("#rows").innerHTML = html;
    fitRows();
    if (data) apply(data, true);
    $("#cntLabel").textContent = count + "명";
    bindCells();
    scaleToFit();
    layoutAllTodo();
    updateAllWday();
    refreshOut();
  }

  // 연동 패널이 열린 채로 내용을 더 입력하면 코드가 옛날 상태로 남는 걸 방지
  function refreshOut(){
    if ($("#syncpanel").classList.contains("open")) $("#sync-out").value = encode(exportStr());
  }

  // 인원 수에 맞춰 행 높이를 늘려 한 페이지를 꽉 채움
  // ※ cm로 주면 브라우저 px 반올림이 39행에 누적돼 페이지를 넘김 → 정수 px로 고정
  const PX_CM = 96/2.54;
  function fitRows(){
    const usablePx = Math.floor(USABLE_CM * PX_CM) - 2;          // 안전 여유 2px
    const per = Math.max(
      Math.ceil(MIN_ROW_CM * PX_CM),
      Math.min(Math.floor(MAX_ROW_CM * PX_CM), Math.floor(usablePx/(count*3)))
    );
    document.querySelectorAll("#rows tr").forEach(tr => tr.style.height = per+"px");
  }

  function bindCells(){
    document.querySelectorAll(".tg").forEach(el => {
      const k = el.dataset.k;
      if (k === "b" || k === "o2l") return;   // B*, L 은 클릭 사이클(아래 별도 바인딩)
      el.addEventListener("click", () => { setTg(el, el.classList.contains("off")); refreshOut(); });
    });
    // B* : 클릭마다 4 → 2 → 1 → 빈칸(입력) → 끔
    document.querySelectorAll('[data-k="b"]').forEach(b => b.addEventListener("click", () => cycleB(b)));
    // L : 클릭마다 2L → 입력 → 끔
    document.querySelectorAll('[data-k="o2l"]').forEach(l => l.addEventListener("click", () => cycleL(l)));
    // 이름 밑 날짜: 입력 시 요일 자동
    document.querySelectorAll(".dcdate").forEach(el => {
      el.addEventListener("input", () => { updateWday(el); refreshOut(); });
    });
    document.querySelectorAll(".addV").forEach(btn => {           // 세로(오른쪽) 추가
      btn.addEventListener("click", () => {
        const z = document.querySelector(`.vzone[data-i="${btn.dataset.i}"]`);
        const it = addTodoItem(z, "", 0); layoutVert(z); it.querySelector(".ttext").focus(); refreshOut();
      });
    });
    const addToRow = (sel, btn) => {
      const z = document.querySelector(`${sel}[data-i="${btn.dataset.i}"]`);
      const it = addTodoItem(z, "", 0); layoutHorz(z); it.querySelector(".ttext").focus(); refreshOut();
    };
    document.querySelectorAll(".addH").forEach(btn => btn.addEventListener("click", () => addToRow(".hrow", btn)));  // 가로 할 일
    document.querySelectorAll(".addC").forEach(btn => btn.addEventListener("click", () => addToRow(".crow", btn)));  // 협진
    // 이름 칸: Enter(또는 Tab) → 다음 환자 이름, Shift 동반 시 이전
    document.querySelectorAll('[data-k="name"]').forEach(el => {
      el.addEventListener("keydown", ev => {
        const enter = ev.key === "Enter", tab = ev.key === "Tab";
        if (!enter && !tab) return;
        if (enter && (ev.isComposing || ev.keyCode === 229)) return;   // 한글 조합 확정용 Enter는 무시
        const i = +el.dataset.i, ni = ev.shiftKey ? i - 1 : i + 1;
        const next = document.querySelector(`[data-i="${ni}"][data-k="name"]`);
        if (next){ ev.preventDefault(); next.focus(); next.select && next.select(); }
      });
    });
    bindDrag();
  }
  // B* 사이클: 끔 → 4 → 2 → 1 → 빈칸(입력) → 끔
  function cycleB(b){
    const bn = document.querySelector(`[data-i="${b.dataset.i}"][data-k="bn"]`);
    const on = !b.classList.contains("off"), v = bn.value.trim();
    if (!on){ setTg(b, true); bn.value = "4"; }
    else if (v === "4"){ bn.value = "2"; }
    else if (v === "2"){ bn.value = "1"; }
    else if (v === "1"){ bn.value = ""; bn.focus(); }        // 빈칸 → 직접 입력
    else { setTg(b, false); bn.value = ""; }                 // 끔
    refreshOut();
  }
  // L 사이클: 끔 → 2L → 입력 → 끔
  function cycleL(l){
    const n = document.querySelector(`[data-i="${l.dataset.i}"][data-k="o2n"]`);
    const on = !l.classList.contains("off"), v = n.value.trim();
    if (!on){ setTg(l, true); n.value = "2"; }
    else if (v === "2"){ n.value = ""; n.focus(); }   // 2L → 직접 입력
    else { setTg(l, false); n.value = ""; }           // 끔
    refreshOut();
  }
  // 날짜 M/D → 가까운 미래 연도로 요일 자동 (예: 12/28에 1/1 입력 → 내년)
  function updateWday(el){
    const span = el.closest(".dcrow").querySelector(".dcwday");
    const m = (el.value || "").match(/^\s*(\d{1,2})\s*\/\s*(\d{1,2})\s*$/);
    if (!m){ span.textContent = ""; return; }
    const mo = +m[1], d = +m[2];
    if (mo < 1 || mo > 12 || d < 1 || d > 31){ span.textContent = ""; return; }
    const now = new Date(); now.setHours(0,0,0,0);
    let dt = new Date(now.getFullYear(), mo - 1, d);
    if (dt < now) dt = new Date(now.getFullYear() + 1, mo - 1, d);
    if (dt.getMonth() !== mo - 1){ span.textContent = ""; return; }   // 2/30 같은 무효 날짜
    span.textContent = "(" + WDAYS[dt.getDay()] + ")";
  }
  function updateAllWday(){ document.querySelectorAll(".dcdate").forEach(updateWday); }

  /* ── 환자 순서 변경 (三 핸들 드래그, 터치/마우스 공용) ──── */
  let dragSrc = null;
  function blockIndexAtY(y){
    const rows = [...document.querySelectorAll("#rows tr.r1")];
    if (!rows.length) return null;
    for (let k=0;k<rows.length;k++){
      const i = +rows[k].dataset.i;
      const top = rows[k].getBoundingClientRect().top;
      const r3 = document.querySelector(`#rows tr.r3[data-i="${i}"]`);
      const bottom = rows[k+1] ? rows[k+1].getBoundingClientRect().top
                               : (r3 ? r3.getBoundingClientRect().bottom : top + 9999);
      if (y < bottom) return { i, before: y < (top + bottom) / 2 };
    }
    return { i:+rows[rows.length-1].dataset.i, before:false };
  }
  function markTarget(t){
    document.querySelectorAll("#rows tr.drop-target").forEach(tr => tr.classList.remove("drop-target"));
    if (t && t.i !== dragSrc) document.querySelectorAll(`#rows tr[data-i="${t.i}"]`).forEach(tr => tr.classList.add("drop-target"));
  }
  function reorderPatients(src, dst){
    if (src === dst) return;
    const data = collect();
    const [moved] = data.splice(src, 1);
    data.splice(dst, 0, moved);
    render(false);
    apply(data, true);
  }
  function bindDrag(){
    document.querySelectorAll(".draghandle").forEach(h => {
      h.addEventListener("pointerdown", e => {
        e.preventDefault();
        dragSrc = +h.dataset.i;
        document.body.classList.add("dragging");
        try { h.setPointerCapture(e.pointerId); } catch(_){}
      });
      h.addEventListener("pointermove", e => {
        if (dragSrc === null) return;
        markTarget(blockIndexAtY(e.clientY));
      });
      h.addEventListener("pointerup", e => {
        if (dragSrc === null) return;
        const t = blockIndexAtY(e.clientY);
        const src = dragSrc; dragSrc = null;
        document.body.classList.remove("dragging");
        document.querySelectorAll("#rows tr.drop-target").forEach(tr => tr.classList.remove("drop-target"));
        if (!t) return;
        // 위쪽 절반이면 그 자리 앞, 아래면 뒤로
        let dst = t.i + (t.before ? 0 : 1);
        if (src < dst) dst--;                 // 앞에서 빼면 인덱스 한 칸 당겨짐
        dst = Math.max(0, Math.min(document.querySelectorAll("#rows tr.r1").length - 1, dst));
        reorderPatients(src, dst);
      });
      h.addEventListener("pointercancel", () => {
        dragSrc = null; document.body.classList.remove("dragging");
        document.querySelectorAll("#rows tr.drop-target").forEach(tr => tr.classList.remove("drop-target"));
      });
    });
  }
  function setTg(el,on){
    el.classList.toggle("off",!on);
    el.textContent = el.dataset.label;   // 꺼짐 상태는 CSS로 회색/인쇄시 투명
    if (el.dataset.k === "s") updateSpo2(el.dataset.i);   // S ↔ V/S SpO2 괄호 연동
  }
  // S 토글이 켜져 있으면 V/S 칸 끝에 (SpO2) 괄호를 보이게
  function updateSpo2(i){
    const s  = document.querySelector(`[data-i="${i}"][data-k="s"]`);
    const vs = document.querySelector(`[data-i="${i}"][data-k="vs"]`);
    if (!s || !vs) return;
    vs.classList.toggle("son", !s.classList.contains("off"));
    fitVS(vs);   // SpO2 켜지면 템플릿이 넓어지므로 폭에 맞게 폰트 다시 축소(끝 괄호 잘림 방지)
  }

  /* ── 할 일 리스트 (메모 7칸 병합, 3열 우측→좌측 채움) ──── */
  // 한 항목 = [편집 텍스트][완료 괄호]. wrap._items 가 순서의 진실원.
  const CHK_ON = "(&nbsp;+&nbsp;)", CHK_OFF = "(&nbsp;&nbsp;&nbsp;)";   // 좀 더 넓게
  function makeChk(done){
    const c = document.createElement("span");
    c.className = "tchk" + (done ? " on" : "");
    c.innerHTML = done ? CHK_ON : CHK_OFF;
    c.addEventListener("click", () => {
      const on = !c.classList.contains("on");
      c.classList.toggle("on", on); c.innerHTML = on ? CHK_ON : CHK_OFF;
      refreshOut();
    });
    return c;
  }
  function makeArrow(){ const s = document.createElement("span"); s.className = "tmark"; s.textContent = "▶"; return s; }
  // zone = 항목 컨테이너(.vzone 세로 / .hrow 가로 할 일 / .crow 협진).
  //  · zone._layout : 전체 재배치(DOM 재부착) — 추가/삭제/편집종료 때만
  //  · zone._fitFont: 폰트만 조정(재부착 없음) — 타이핑 중 (한글 IME 안 깨지게)
  function zoneKind(zone){
    const horizontal = zone.classList.contains("hrow") || zone.classList.contains("crow");
    return { horizontal, arrow: zone.classList.contains("crow") };
  }
  function ensureZoneFns(zone){
    if (zone._layout) return;
    const { horizontal } = zoneKind(zone);
    zone._layout  = horizontal ? () => layoutHorz(zone)   : () => layoutVert(zone);
    zone._fitFont = horizontal ? () => fitHorzFont(zone)  : () => fitVertFont(zone);
  }
  function addTodoItem(zone, html, done){
    ensureZoneFns(zone);
    zone._items = zone._items || [];
    const it = document.createElement("div"); it.className = "todoitem";
    const mk = zoneKind(zone).arrow ? makeArrow() : makeChk(done);
    const tx = document.createElement("span");
    tx.className = "ttext"; tx.contentEditable = "true"; if (html) tx.innerHTML = html;
    // ⚠ 한글 IME: 조합 중은 물론, 타이핑 전반에서 항목을 재부착하면 자모/단어가 씹힘
    //   → 타이핑 중엔 폰트만(_fitFont), 전체 재배치(_layout)는 추가/삭제/편집종료 때만.
    tx.addEventListener("compositionstart", () => { tx._composing = true; });
    tx.addEventListener("compositionend",   () => { tx._composing = false; zone._fitFont(); refreshOut(); });
    tx.addEventListener("input", () => { if (!tx._composing) zone._fitFont(); refreshOut(); });
    tx.addEventListener("contextmenu", onCtx);
    const removeSelf = () => {                             // DOM만 제거(재배치 X → 포커스 뺏김 방지)
      const idx = zone._items.indexOf(it); if (idx >= 0) zone._items.splice(idx,1);
      it.remove();
      return idx;
    };
    tx.addEventListener("keydown", ev => {
      if (ev.key === "Enter"){
        if (ev.isComposing || ev.keyCode === 229) return;
        ev.preventDefault();
        const nit = addTodoItem(zone, "", 0); zone._layout(); nit.querySelector(".ttext").focus(); refreshOut();
      } else if (ev.key === "Backspace" && !tx.textContent.trim() && !tx._composing){
        ev.preventDefault();                              // 빈 항목 Backspace → 삭제하고 이전 항목으로
        const idx = removeSelf();
        const prev = zone._items[Math.max(0, idx - 1)];
        if (prev) { const p = prev.querySelector(".ttext"); p.focus();
          const r = document.createRange(); r.selectNodeContents(p); r.collapse(false);
          const s = window.getSelection(); s.removeAllRanges(); s.addRange(r); }
        refreshOut();
      }
    });
    tx.addEventListener("blur", () => {                    // 편집 종료: 빈 항목이면 그냥 제거(재배치 안 함 → 포커스 안 뺏김)
      if (!tx.textContent.trim()){ removeSelf(); refreshOut(); }
    });
    it.appendChild(tx); it.appendChild(mk);
    zone._items.push(it);
    return it;
  }
  // 편집 중 DOM 재부착 시 커서 보존 (root 안에서)
  function saveCaret(root){
    const sel = window.getSelection();
    if (!sel || !sel.rangeCount) return null;
    const n = sel.anchorNode;
    const tt = n && (n.nodeType === 3 ? n.parentElement : n);
    const ttext = tt && tt.closest && tt.closest(".ttext");
    if (!ttext || !root.contains(ttext)) return null;
    const r = document.createRange();
    r.selectNodeContents(ttext); r.setEnd(sel.anchorNode, sel.anchorOffset);
    return { ttext, offset: r.toString().length };
  }
  function restoreCaret(s){
    if (!s || !s.ttext.isConnected) return;
    s.ttext.focus();
    const walker = document.createTreeWalker(s.ttext, NodeFilter.SHOW_TEXT);
    let acc = 0, tn, target = null, off = 0;
    while ((tn = walker.nextNode())){
      if (acc + tn.length >= s.offset){ target = tn; off = s.offset - acc; break; }
      acc += tn.length;
    }
    const range = document.createRange();
    if (target){ range.setStart(target, off); range.collapse(true); }
    else { range.selectNodeContents(s.ttext); range.collapse(false); }
    const sel = window.getSelection(); sel.removeAllRanges(); sel.addRange(range);
  }

  // 세로 할 일: 2열(우 vcR → 좌 vcL) 채움, 폰트축소 → 그래도 길면 줄바꿈
  function layoutVert(vzone){
    if (!vzone) return;
    const vcR = vzone.querySelector(".vcR"), vcL = vzone.querySelector(".vcL");
    const order = [vcR, vcL];                     // 우측 먼저
    const items = vzone._items || [];
    const setFont = f => order.forEach(c => c.style.fontSize = f + "pt");
    const setWrap = on => { vzone.classList.toggle("wrapmode", on);
      items.forEach(it => it.querySelector(".ttext").style.whiteSpace = on ? "normal" : "nowrap"); };
    const place = () => {
      order.forEach(c => c.innerHTML = "");
      let ci = 0;
      for (const it of items){
        while (ci < order.length){
          order[ci].appendChild(it);
          if (order[ci].scrollHeight <= order[ci].clientHeight + 1) break;
          order[ci].removeChild(it); ci++;
        }
        if (ci >= order.length) return false;
      }
      return true;
    };
    const clipped = () => items.some(it => { const t = it.querySelector(".ttext"); return t.scrollWidth > t.clientWidth + 1; });
    setWrap(false);
    for (let fs = 8.5; fs >= 6; fs -= 0.5){ setFont(fs); if (place() && !clipped()) return; }
    setFont(6);
    if (place()){                                 // 세로 자리는 되는데 가로로 잘림 → 줄바꿈
      setWrap(true);
      for (let fs = 7; fs >= 5; fs -= 0.5){ setFont(fs); if (place()) return; }
      return;
    }
    setWrap(false);                               // 세로 넘침 → 더 축소
    for (let fs = 6; fs >= 4.5; fs -= 0.5){ setFont(fs); if (place()) break; }
  }
  // 가로 할 일: hrow에 왼→오 흐름(flex-wrap), 세로 넘치면 폰트 축소
  function layoutHorz(hrow){
    if (!hrow) return;
    const hzone = hrow.parentElement;
    const items = hrow._items || [];
    hrow.innerHTML = "";
    items.forEach(it => { it.querySelector(".ttext").style.whiteSpace = "nowrap"; hrow.appendChild(it); });
    let fs = 8; hrow.style.fontSize = fs + "pt"; let guard = 0;
    while (hrow.scrollHeight > hzone.clientHeight + 1 && fs > 5 && guard++ < 20){ fs -= 0.5; hrow.style.fontSize = fs + "pt"; }
  }
  // 타이핑 중 폰트만 조정(재부착 없음). 세로: 잘리면 축소→줄바꿈
  function fitVertFont(vzone){
    if (!vzone) return;
    const items = vzone._items || [];
    const cols = [vzone.querySelector(".vcR"), vzone.querySelector(".vcL")];
    const setFont = f => cols.forEach(c => c.style.fontSize = f + "pt");
    const clipped = () => items.some(it => { const t = it.querySelector(".ttext"); return t.scrollWidth > t.clientWidth + 1; });
    let fs = parseFloat(cols[0].style.fontSize) || 8.5, guard = 0;
    while (clipped() && fs > 6 && guard++ < 8){ fs -= 0.5; setFont(fs); }
    if (clipped()){ vzone.classList.add("wrapmode"); items.forEach(it => it.querySelector(".ttext").style.whiteSpace = "normal"); }
  }
  // 가로(할 일/협진): 세로로 넘치면 폰트만 축소
  function fitHorzFont(hrow){
    if (!hrow) return;
    const hzone = hrow.parentElement;
    let fs = parseFloat(hrow.style.fontSize) || 8, guard = 0;
    while (hrow.scrollHeight > hzone.clientHeight + 1 && fs > 5 && guard++ < 12){ fs -= 0.5; hrow.style.fontSize = fs + "pt"; }
  }
  // V/S: (좁아진) 폭에 맞게 폰트 축소
  function fitVS(vs){
    const tpl = vs && vs.querySelector(".vstpl"); if (!tpl) return;
    let fs = 9; tpl.style.fontSize = fs + "pt"; let guard = 0;
    while (tpl.scrollWidth > vs.clientWidth + 1 && fs > 5 && guard++ < 12){ fs -= 0.5; tpl.style.fontSize = fs + "pt"; }
  }
  // 4구역 위치/크기 (셀 기준: td 퍼센트 높이가 불안정)
  function positionZones(wrap){
    const cell = wrap.closest("td"); if (!cell) return;
    const W = cell.clientWidth, H = cell.clientHeight;
    wrap.style.width = W + "px"; wrap.style.height = H + "px";
    const W2 = Math.round(W * 0.5), rowH = H / 3;
    const vsH = Math.round(rowH * 0.8), consH = Math.round(rowH * 0.72), hzH = H - vsH - consH;
    const vz = wrap.querySelector(".vzone"), hz = wrap.querySelector(".hzone"),
          cz = wrap.querySelector(".czone"), vs = wrap.querySelector(".vs");
    vz.style.width = (W - W2) + "px"; vz.style.height = H + "px";
    vz.querySelectorAll(".todocol").forEach(c => c.style.height = H + "px");
    hz.style.width = W2 + "px"; hz.style.height = hzH + "px";
    cz.style.top = hzH + "px"; cz.style.width = W2 + "px"; cz.style.height = consH + "px";
    vs.style.top = (hzH + consH) + "px"; vs.style.width = (W2 - 1) + "px"; vs.style.height = vsH + "px";
    wrap.querySelector(".addV").style.right = "0px";
    wrap.querySelector(".addH").style.left = "0px";
    const addC = wrap.querySelector(".addC"); addC.style.left = "0px"; addC.style.top = hzH + "px";
  }
  function layoutTodo(wrap){
    if (!wrap) return;
    positionZones(wrap);
    layoutVert(wrap.querySelector(".vzone"));
    layoutHorz(wrap.querySelector(".hrow"));
    layoutHorz(wrap.querySelector(".crow"));
    fitVS(wrap.querySelector(".vs"));
  }
  function layoutAllTodo(){ document.querySelectorAll(".todowrap").forEach(layoutTodo); }

  /* ── 상태 수집 / 적용 (DOM이 단일 진실원) ─────────────── */
  function collect(){
    const out = [];
    for (let i=0;i<count;i++){
      const o = {};
      KEYS.forEach(k => {
        const el = document.querySelector(`[data-i="${i}"][data-k="${k}"]`);
        if (!el) return;
        if (el.classList.contains("tg")) { if (!el.classList.contains("off")) o[k] = 1; }
        else if (el.classList.contains("vzone") || el.classList.contains("hrow") || el.classList.contains("crow")) {  // 세로/가로 할 일/협진
          const items = (el._items || [])
            .filter(it => it.querySelector(".ttext").textContent.trim())
            .map(it => {
              const rec = { t: it.querySelector(".ttext").innerHTML };
              const chk = it.querySelector(".tchk");
              if (chk && chk.classList.contains("on")) rec.c = 1;
              return rec;
            });
          if (items.length) o[k] = items;
        }
        else if (el.value) o[k] = el.value;
      });
      out.push(o);
    }
    return out;
  }
  function apply(list, silent){
    if (!silent){
      const need = Math.min(MAX, Math.max(1, list.length));
      if (need !== count){ count = need; render(false); }
    }
    for (let i=0;i<count;i++){
      const o = list[i] || {};
      KEYS.forEach(k => {
        const el = document.querySelector(`[data-i="${i}"][data-k="${k}"]`);
        if (!el) return;
        if (el.classList.contains("tg")) setTg(el, !!o[k]);
        else if (el.classList.contains("vzone") || el.classList.contains("hrow") || el.classList.contains("crow")) {
          const horizontal = !el.classList.contains("vzone");
          el._items = [];
          if (horizontal) el.innerHTML = "";
          else el.querySelectorAll(".todocol").forEach(c => c.innerHTML = "");
          (Array.isArray(o[k]) ? o[k] : []).forEach(x => {
            const t = (typeof x === "string") ? x : (x && x.t) || "";
            const c = (x && typeof x === "object" && x.c) ? 1 : 0;
            addTodoItem(el, t, c);
          });
          horizontal ? layoutHorz(el) : layoutVert(el);
        }
        else el.value = o[k] || "";
      });
    }
    updateAllWday();   // 가져온 날짜의 요일 다시 표시
  }
  function isEmpty(){
    return collect().every(o => Object.keys(o).length === 0);
  }

  /* ── 연동: XOR(고정키) → base64, 접두사 HND1: ─────────── */
  const XKEY = "handoff-sheet-sync-key";
  function xorBytes(bytes){
    const k = new TextEncoder().encode(XKEY);
    const out = new Uint8Array(bytes.length);
    for (let i=0;i<bytes.length;i++) out[i] = bytes[i] ^ k[i % k.length];
    return out;
  }
  function encode(str){
    const b = xorBytes(new TextEncoder().encode(str));
    let bin = ""; b.forEach(x => bin += String.fromCharCode(x));
    return "HND1:" + btoa(bin);
  }
  function decode(code){
    code = (code||"").trim();
    if (!code.startsWith("HND1:")) return code;         // 평문 JSON도 하위호환
    const bin = atob(code.slice(5));
    const bytes = xorBytes(Uint8Array.from(bin, c => c.charCodeAt(0)));
    return new TextDecoder().decode(bytes);
  }
  function exportStr(){ return JSON.stringify({ v:1, n:count, p:collect() }); }
  function flash(btn, text){ const o = btn.textContent; btn.textContent = text; setTimeout(()=>btn.textContent=o,1200); }

  function applyStr(raw){
    const str = decode((raw||"").trim());
    if (!str){ alert("불러올 코드나 파일이 없어요."); return; }
    let data; try { data = JSON.parse(str); } catch { alert("코드 형식이 올바르지 않아요."); return; }
    const list = Array.isArray(data.p) ? data.p : (Array.isArray(data) ? data : null);
    if (!list){ alert("인계장 데이터를 찾을 수 없어요."); return; }
    const filled = list.filter(o => o && Object.keys(o).length).length;
    if (!confirm(`지금 화면을 불러온 데이터(${filled}명 기재)로 덮어쓸까요?`)) return;
    count = Math.min(MAX, Math.max(1, data.n || list.length || MAX));
    render(false);
    apply(list, true);
    $("#syncpanel").classList.remove("open");
    alert("적용됐어요.");
  }

  /* ── 툴바 ─────────────────────────────────────────────── */
  $("#plus").addEventListener("click", () => { if (count<MAX){ count++; render(true);} });
  $("#minus").addEventListener("click", () => {
    if (count<=1) return;
    const last = collect()[count-1];
    if (Object.keys(last).length && !confirm("마지막 줄에 적힌 내용이 지워져요. 계속할까요?")) return;
    count--; render(true);
  });
  $("#printBtn").addEventListener("click", () => window.print());
  $("#clearBtn").addEventListener("click", () => {
    if (isEmpty() || confirm("전체 내용을 지울까요? 되돌릴 수 없어요.")) render(false);
  });

  $("#syncBtn").addEventListener("click", () => {
    const p = $("#syncpanel");
    if (p.classList.contains("open")){ p.classList.remove("open"); return; }
    $("#sync-out").value = encode(exportStr());
    $("#sync-in").value = "";
    p.classList.add("open");
  });
  $("#syncCopy").addEventListener("click", async () => {
    const el = $("#sync-out");
    try { await navigator.clipboard.writeText(el.value); }
    catch { el.select(); document.execCommand("copy"); }
    flash($("#syncCopy"), "복사됨!");
  });
  $("#syncSave").addEventListener("click", () => {
    const blob = new Blob([encode(exportStr())], { type:"text/plain" });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "handoff-" + new Date().toISOString().slice(0,10) + ".txt";
    a.click();
    setTimeout(()=>URL.revokeObjectURL(a.href),1000);
  });
  $("#syncApply").addEventListener("click", () => applyStr($("#sync-in").value));
  $("#syncOpen").addEventListener("click", () => $("#syncFile").click());
  $("#syncFile").addEventListener("change", e => {
    const f = e.target.files[0]; if (!f) return;
    const rd = new FileReader();
    rd.onload = () => applyStr(rd.result);
    rd.readAsText(f);
    e.target.value = "";
  });

  /* ── 폰에서 가로폭 맞추기 (인쇄엔 영향 없음) ──────────── */
  function scaleToFit(){
    const sheet = $("#sheet");
    sheet.style.transform = "none";
    sheet.style.marginBottom = "";
    const avail = document.querySelector(".stage").clientWidth - 4;
    const w = sheet.offsetWidth;
    if (w > avail){
      const s = avail / w;
      sheet.style.transform = `scale(${s})`;
      sheet.style.marginBottom = (sheet.offsetHeight*(s-1)) + "px";
    }
  }
  window.addEventListener("resize", scaleToFit);
  $("#rows").addEventListener("input", refreshOut);

  /* ── 우클릭 서식 메뉴 (오른쪽 칸 리치텍스트) ──────────── */
  let menuEl = null, ctxTarget = null, ctxRange = null;
  function getMenu(){
    if (menuEl) return menuEl;
    const m = document.createElement("div");
    m.className = "ctxmenu no-print";
    m.innerHTML =
      `<div class="cm-row cm-colors">
         <button data-act="fore" data-v="#000000" style="color:#000" title="검정">가</button>
         <button data-act="fore" data-v="#dc2626" style="color:#dc2626" title="빨강">가</button>
         <button data-act="fore" data-v="#2563eb" style="color:#2563eb" title="파랑">가</button>
         <button data-act="fore" data-v="#16a34a" style="color:#16a34a" title="초록">가</button>
         <button data-act="fore" data-v="#7c3aed" style="color:#7c3aed" title="보라">가</button>
       </div>
       <div class="cm-row cm-hl">
         <button data-act="hl" data-v="#fde047" style="background:#fde047" title="노랑">&nbsp;</button>
         <button data-act="hl" data-v="#bef264" style="background:#bef264" title="연두">&nbsp;</button>
         <button data-act="hl" data-v="#7dd3fc" style="background:#7dd3fc" title="하늘">&nbsp;</button>
         <button data-act="hl" data-v="transparent" title="형광펜 지우기">✕</button>
       </div>
       <div class="cm-row">
         <button data-act="bold" title="볼드"><b>B</b> 볼드</button>
         <button data-act="clear" title="서식 지우기">서식지우기</button>
       </div>`;
    document.body.appendChild(m);
    // 메뉴를 누를 때 편집칸의 선택영역/포커스가 풀리지 않게
    m.addEventListener("mousedown", ev => ev.preventDefault());
    m.addEventListener("click", ev => {
      const b = ev.target.closest("button"); if (!b) return;
      applyFmt(b.dataset.act, b.dataset.v);
      m.classList.remove("open");
    });
    menuEl = m;
    return m;
  }
  function onCtx(e){
    e.preventDefault();
    ctxTarget = e.currentTarget;
    const sel = window.getSelection();
    ctxRange = (sel && sel.rangeCount && ctxTarget.contains(sel.anchorNode))
      ? sel.getRangeAt(0).cloneRange() : null;
    const m = getMenu();
    m.classList.add("open");
    const mw = m.offsetWidth || 180, mh = m.offsetHeight || 130;
    m.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth  - mw - 4)) + "px";
    m.style.top  = Math.max(4, Math.min(e.clientY, window.innerHeight - mh - 4)) + "px";
  }
  function applyFmt(act, v){
    const t = ctxTarget; if (!t) return;
    t.focus();
    const sel = window.getSelection();
    sel.removeAllRanges();
    let range;
    if (ctxRange && !ctxRange.collapsed){ range = ctxRange; }
    else { range = document.createRange(); range.selectNodeContents(t); }  // 선택 없으면 칸 전체
    sel.addRange(range);
    try { document.execCommand("styleWithCSS", false, true); } catch(_){}
    if      (act === "fore") document.execCommand("foreColor",  false, v);
    else if (act === "hl")   document.execCommand("hiliteColor", false, v);
    else if (act === "bold") document.execCommand("bold");
    else if (act === "clear"){ document.execCommand("removeFormat"); document.execCommand("hiliteColor", false, "transparent"); }
    const wrap = t.closest(".todowrap"); if (wrap) layoutTodo(wrap);
    refreshOut();
  }
  document.addEventListener("click", e => {
    if (menuEl && menuEl.classList.contains("open") && !menuEl.contains(e.target)) menuEl.classList.remove("open");
  });
  document.addEventListener("keydown", e => { if (e.key === "Escape" && menuEl) menuEl.classList.remove("open"); });
  window.addEventListener("scroll", () => { if (menuEl) menuEl.classList.remove("open"); }, true);

  /* ── 실수로 닫기 방지 (저장은 안 함) ──────────────────── */
  window.addEventListener("beforeunload", e => {
    if (!isEmpty()){ e.preventDefault(); e.returnValue = ""; }
  });

  render(false);

  if ("serviceWorker" in navigator)
    window.addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(()=>{}));
})();
</script>
</body>
</html>
