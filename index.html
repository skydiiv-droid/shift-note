<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#334155">
<title>인계장</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="인계장">
<style>
  :root{
    --ink:#000;
    --line:0.5pt solid #000;
    --guide:#e2e8f0;
    --ph:#cbd5e1;
    --fs-name:9.5pt;
    --fs-cell:9pt;
    --fs-memo:8.5pt;
    --fs-mini:7.5pt;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:#f1f5f9;
    font-family:'맑은 고딕','Malgun Gothic','Apple SD Gothic Neo',sans-serif;
    color:#0f172a;
    -webkit-text-size-adjust:100%;
  }

  /* ───────── 툴바 ───────── */
  .bar{
    position:sticky; top:0; z-index:20;
    background:#334155; color:#fff;
    padding:8px 10px;
    display:flex; flex-wrap:wrap; gap:6px; align-items:center;
    box-shadow:0 1px 4px rgba(0,0,0,.25);
  }
  .bar b{font-size:14px; margin-right:4px; letter-spacing:.5px}
  .bar button{
    font:inherit; font-size:13px;
    background:#475569; color:#fff; border:0; border-radius:6px;
    padding:6px 10px; cursor:pointer; white-space:nowrap;
  }
  .bar button:hover{background:#64748b}
  .bar button.primary{background:#0ea5e9}
  .bar button.primary:hover{background:#38bdf8}
  .bar button.danger{background:#9f1239}
  .bar button.danger:hover{background:#be123c}
  .cnt{display:flex; align-items:center; gap:4px; background:#475569; border-radius:6px; padding:2px 4px}
  .cnt button{padding:3px 9px; background:transparent; font-size:15px; line-height:1}
  .cnt span{font-size:13px; min-width:56px; text-align:center}
  .sp{flex:1}
  .hint{font-size:11px; color:#cbd5e1; width:100%; margin-top:2px}

  /* ───────── 연동 패널 ───────── */
  .sync{display:none; background:#1e293b; color:#e2e8f0; padding:10px; gap:8px; flex-direction:column}
  .sync.open{display:flex}
  .sync .row{display:flex; gap:6px; align-items:center; flex-wrap:wrap}
  .sync label{font-size:12px; color:#94a3b8; width:100%}
  .sync textarea{
    width:100%; height:58px; resize:vertical;
    font-family:ui-monospace,Menlo,Consolas,monospace; font-size:11px;
    border-radius:6px; border:1px solid #475569; background:#0f172a; color:#e2e8f0; padding:6px;
  }
  .sync button{
    font:inherit; font-size:12px; background:#475569; color:#fff;
    border:0; border-radius:6px; padding:5px 10px; cursor:pointer;
  }
  .sync button:hover{background:#64748b}

  /* ───────── 용지 ───────── */
  .stage{padding:14px; display:flex; justify-content:center}
  .sheet{
    width:17cm;
    background:#fff;
    box-shadow:0 2px 12px rgba(15,23,42,.18);
    padding:0;
    transform-origin:top center;
  }
  table.form{
    width:17cm; table-collapse:collapse; border-collapse:collapse;
    table-layout:fixed;
  }
  table.form td{
    padding:0 1px; margin:0;
    vertical-align:middle;
    overflow:hidden;
    border:0;
  }

  /* 블록 테두리 — ODT 원본 규칙
     ※ 위 `table.form td{border:0}`보다 특이도가 높아야 해서 전부 table.form 접두사 유지 */
  table.form tr.r1 td{border-top:var(--line)}
  table.form tr.r3 td{border-bottom:var(--line)}
  table.form td.name{border:var(--line)}                      /* 이름칸 전체 박스 */
  table.form td.f{border-right:var(--line)}                   /* special V/S 우측 구분선 */
  table.form td.gut{border-top:var(--line);border-bottom:var(--line)}  /* 얇은 거터(rowspan 3) */

  /* 화면 전용 셀 가이드 */
  @media screen{
    table.form td{outline:1px dotted var(--guide); outline-offset:-1px}
    td.name{outline:0}
  }

  /* ───────── 입력 요소 ───────── */
  input.f{
    width:100%; border:0; background:transparent; outline:0;
    font-family:inherit; color:var(--ink);
    font-size:var(--fs-cell); padding:0 1px; margin:0;
    line-height:1.1;
  }
  input.f::placeholder{color:var(--ph)}
  input.f:focus{background:#e0f2fe}
  input.nm{font-size:var(--fs-name); text-align:center; font-weight:600}
  input.memo{font-size:var(--fs-memo)}
  input.mini{font-size:var(--fs-mini); text-align:center}
  input.ctr{text-align:center}

  /* 토글 (고정 라벨: 켜짐=인쇄됨) */
  .tg{
    display:block; width:100%; min-height:1.15em; text-align:center; cursor:pointer;
    font-size:var(--fs-cell); line-height:1.15;
    color:var(--ink); user-select:none; white-space:nowrap;
  }
  .tg.sm{font-size:var(--fs-mini)}
  .tg.off{color:var(--ph)}
  .tg:hover{background:#e0f2fe}
  .tg.al{text-align:left; padding-left:2px}    /* 좌측정렬 (가운데에 수치 손글씨) */
  .tg.ar{text-align:right; padding-right:2px}   /* 우측정렬 */

  .nmwrap{display:flex; flex-direction:column; justify-content:center; height:100%; gap:0.55em}

  /* O2 유량 입력 + L 토글 (우측정렬) */
  .o2wrap{display:flex; align-items:center; width:100%}
  .o2wrap .o2in{flex:1; min-width:0; text-align:left; padding-left:2px}
  .tg.o2l{width:auto; flex:0 0 auto; padding:0 2px}

  /* 정규 V/S 손글씨 템플릿 (SBP/DBP-HR-RR-BT-SpO2) — 각 칸에 흐린 가이드 라벨 */
  .vstpl{font-size:var(--fs-cell); white-space:nowrap; color:var(--ink); letter-spacing:0}
  .vsl{display:inline-block; min-width:0.8cm; text-align:center}
  .vsl i{font-style:normal; font-size:6pt; color:#c3ccd8}   /* 손글씨로 덮어써도 방해 안 될 만큼 흐리게 */
  .vspo2{display:none}
  .vs.son .vspo2{display:inline}

  /* ── 오른쪽 "할 일" 칸(3칸 병합) ───────────────────── */
  td.todo{vertical-align:top; padding:0}
  .todowrap{position:relative; height:100%; width:100%}
  .todocols{position:absolute; inset:0; display:flex; gap:4px; align-items:flex-start}
  .todocol{
    flex:1; min-width:0; overflow:hidden;
    line-height:1.3; padding:2px 1px 0;
  }
  .tcR{padding-top:17px}                       /* 오른쪽 열만 + 버튼 자리만큼 아래로 */
  .todoitem{
    display:flex; align-items:baseline; gap:2px; justify-content:flex-end;
    overflow:hidden; color:var(--ink); min-height:1.25em;
  }
  .todoitem .ttext{
    flex:1; min-width:0; outline:0; overflow:hidden;
    text-align:right; white-space:nowrap; word-break:break-all;   /* 우측정렬, 줄바꿈 모드에선 여기서 줄바꿈 */
  }
  .todoitem .ttext:focus{background:#e0f2fe}
  .todoitem .tchk{flex:0 0 auto; cursor:pointer; user-select:none; color:var(--ink)}  /* 괄호는 오른쪽(텍스트 뒤) */
  .todoitem .tchk:hover{background:#e0f2fe}
  /* 줄바꿈 모드: 줄 간격 넓히고 괄호를 첫 줄 위쪽에 정렬 */
  .todowrap.wrapmode .todocol{line-height:1.55}
  .todowrap.wrapmode .todoitem{align-items:flex-start; min-height:0}
  /* 좌하단 V/S (오른쪽 열 3칸 높이, 왼쪽 두 열은 2칸 높이 → 남는 좌하단) */
  td.todo .vs{position:absolute; left:0; bottom:0; display:flex; align-items:center}
  .todoadd{
    position:absolute; top:0; right:0; z-index:5;
    width:16px; height:16px; line-height:14px; text-align:center;
    border:1px solid #94a3b8; border-radius:50%;
    background:#fff; color:#475569; font-size:13px; cursor:pointer; user-select:none;
  }
  .todoadd:hover{background:#0ea5e9; color:#fff; border-color:#0ea5e9}

  /* 우클릭 서식 메뉴 */
  .ctxmenu{
    position:fixed; z-index:60; display:none;
    background:#1e293b; border:1px solid #475569; border-radius:8px;
    padding:6px; box-shadow:0 6px 20px rgba(0,0,0,.35);
  }
  .ctxmenu.open{display:block}
  .ctxmenu .cm-row{display:flex; gap:4px; margin:3px 0}
  .ctxmenu button{
    font:inherit; font-size:13px; line-height:1;
    min-width:28px; height:28px; padding:0 6px;
    border:1px solid #475569; border-radius:6px;
    background:#0f172a; color:#e2e8f0; cursor:pointer;
  }
  .ctxmenu button:hover{outline:2px solid #38bdf8}
  .ctxmenu .cm-colors button{font-weight:700; font-size:15px}

  /* ───────── 인쇄 ───────── */
  @page{ size:A4 portrait; margin:1.401cm 2cm; }
  @media print{
    body{background:#fff}
    .bar,.sync,.hint{display:none !important}
    .stage{padding:0; display:block}
    .sheet{width:17cm; box-shadow:none; transform:none !important}
    table.form td{outline:0 !important}
    .tg.off{color:transparent !important}
    input.f:focus{background:transparent}
    input.f::placeholder{color:transparent !important}
    .ctxmenu{display:none !important}
    .todoadd{display:none !important}
    .todoitem .ttext:focus{background:transparent}
    /* 형광펜·글씨색이 인쇄에도 그대로 나오게 */
    .sheet, .sheet *{ -webkit-print-color-adjust:exact; print-color-adjust:exact; }
    html,body{width:17cm}
  }
</style>
</head>
<body>

<div class="bar no-print">
  <b>인계장</b>
  <div class="cnt">
    <button id="minus" title="환자 수 줄이기">−</button>
    <span id="cntLabel">13명</span>
    <button id="plus" title="환자 수 늘리기">+</button>
  </div>
  <button id="printBtn" class="primary">인쇄</button>
  <button id="syncBtn">연동</button>
  <button id="clearBtn" class="danger">전체 지우기</button>
  <div class="sp"></div>
  <div class="hint">저장 안 됨 — 새로고침하면 다 날아가요. 옮기려면 <b>연동</b>으로 코드 복사.</div>
</div>

<div class="sync no-print" id="syncpanel">
  <label>내보내기 — 이 코드를 복사해서 다른 기기 인계장에 붙여넣으세요</label>
  <textarea id="sync-out" readonly></textarea>
  <div class="row">
    <button id="syncCopy">복사</button>
    <button id="syncSave">.txt로 저장</button>
  </div>
  <label>가져오기 — 코드를 붙여넣고 적용</label>
  <textarea id="sync-in" placeholder="HND1:..."></textarea>
  <div class="row">
    <button id="syncApply">적용</button>
    <button id="syncOpen">파일 열기</button>
    <input type="file" id="syncFile" accept=".txt,text/plain" style="display:none">
  </div>
</div>

<div class="stage">
  <div class="sheet" id="sheet">
    <table class="form">
      <colgroup>
        <col style="width:0.533cm"><col style="width:0.533cm"><col style="width:0.533cm"><col style="width:0.534cm">
        <col style="width:2.133cm">
        <col style="width:1.065cm"><col style="width:1.067cm">
        <col style="width:0.192cm">
        <col style="width:3.47cm"><col style="width:3.47cm"><col style="width:3.473cm">
      </colgroup>
      <tbody id="rows"></tbody>
    </table>
  </div>
</div>

<script>
(function(){
  "use strict";
  const $ = s => document.querySelector(s);

  const MAX = 13;
  const USABLE_CM = 29.7 - 1.401*2;   // 26.898cm
  const MIN_ROW_CM = 0.681;           // ODT 원본 행 높이
  const MAX_ROW_CM = 0.95;            // 인원 적을 때 과하게 늘어나지 않게
  let count = MAX;

  // 셀 키 목록 (가져오기/내보내기 순서 고정)
  const KEYS = ["io","iv","lab","ua","ekg","rad","name","dc","bp","bpr","s","o2","o2l","b","m",
                "todo"];

  /* ── 한 환자 블록 3행 생성 ───────────────────────────── */
  function block(i){
    // 라벨은 항상 DOM에 있고, 표시 여부만 .off 로 제어 (비면 클릭 영역이 0이 됨)
    const tg  = (k,label,cls) =>
      `<span class="tg off ${cls||""}" data-k="${k}" data-label="${label}" data-i="${i}" title="${label}">${label}</span>`;
    const inp = (k,cls,ph,ml) =>
      `<input class="f ${cls||""}" data-k="${k}" data-i="${i}" placeholder="${ph||""}"${ml?` maxlength="${ml}"`:""}>`;
    // V/S 슬롯: 작고 흐린 가이드 라벨(손글씨로 덮어써도 되게)
    const vl = (lab) => `<span class="vsl"><i>${lab}</i></span>`;
    // 오른쪽 "할 일" 영역(메모 7칸 = colspan3 rowspan3 병합):
    //  · 3열(우측→좌측) 자동 채움, 좌하단은 V/S 손글씨 템플릿
    //  · 인쇄 안 되는 + 버튼 / Enter 로 줄 추가
    const todoCell =
      `<div class="todowrap" data-k="todo" data-i="${i}">`
      +   `<div class="todocols">`
      +     `<div class="todocol tcL"></div>`
      +     `<div class="todocol tcM"></div>`
      +     `<div class="todocol tcR"></div>`
      +   `</div>`
      +   `<div class="vs" data-i="${i}" data-k="vs"><span class="vstpl">${vl("SBP")} /${vl("DBP")} -${vl("HR")} -${vl("RR")} -${vl("BT")}<span class="vspo2"> -(${vl("SpO2")})</span></span></div>`
      +   `<span class="todoadd no-print" data-i="${i}" title="할 일 추가">+</span>`
      + `</div>`;

    return `
    <tr class="r1" data-i="${i}">
      <td colspan="4" class="a">${tg("io","I/O")}</td>
      <td rowspan="3" class="name">
        <div class="nmwrap">
          ${inp("name","nm","이름")}
          ${tg("dc","d/c","sm")}
        </div>
      </td>
      <td class="e">${tg("bp","BP","al")}</td>
      <td class="f">${tg("bpr","T","ar")}</td>
      <td rowspan="3" class="gut"></td>
      <td colspan="3" rowspan="3" class="todo">${todoCell}</td>
    </tr>
    <tr class="r2" data-i="${i}">
      <td colspan="4" class="a">${inp("iv","ctr mini","IV일",5)}</td>
      <td class="e">${tg("s","S","al")}</td>
      <td class="f"><div class="o2wrap">${inp("o2","mini o2in","",4)}${tg("o2l","L","o2l ar")}</div></td>
    </tr>
    <tr class="r3" data-i="${i}">
      <td class="a">${tg("lab","L","sm")}</td>
      <td class="a">${tg("ua","U","sm")}</td>
      <td class="a">${tg("ekg","E","sm")}</td>
      <td class="a">${tg("rad","R","sm")}</td>
      <td class="e">${tg("b","B","al")}</td>
      <td class="f">${tg("m","m","ar")}</td>
    </tr>`;
  }

  /* ── 렌더 ─────────────────────────────────────────────── */
  function render(keep){
    const data = keep ? collect() : null;
    let html = "";
    for (let i=0;i<count;i++) html += block(i);
    $("#rows").innerHTML = html;
    fitRows();
    if (data) apply(data, true);
    $("#cntLabel").textContent = count + "명";
    bindCells();
    scaleToFit();
    layoutAllTodo();
    refreshOut();
  }

  // 연동 패널이 열린 채로 내용을 더 입력하면 코드가 옛날 상태로 남는 걸 방지
  function refreshOut(){
    if ($("#syncpanel").classList.contains("open")) $("#sync-out").value = encode(exportStr());
  }

  // 인원 수에 맞춰 행 높이를 늘려 한 페이지를 꽉 채움
  // ※ cm로 주면 브라우저 px 반올림이 39행에 누적돼 페이지를 넘김 → 정수 px로 고정
  const PX_CM = 96/2.54;
  function fitRows(){
    const usablePx = Math.floor(USABLE_CM * PX_CM) - 2;          // 안전 여유 2px
    const per = Math.max(
      Math.ceil(MIN_ROW_CM * PX_CM),
      Math.min(Math.floor(MAX_ROW_CM * PX_CM), Math.floor(usablePx/(count*3)))
    );
    document.querySelectorAll("#rows tr").forEach(tr => tr.style.height = per+"px");
  }

  function bindCells(){
    document.querySelectorAll(".tg").forEach(el => {
      el.addEventListener("click", () => { setTg(el, el.classList.contains("off")); refreshOut(); });
    });
    document.querySelectorAll(".todoadd").forEach(btn => {
      btn.addEventListener("click", () => {
        const wrap = document.querySelector(`.todowrap[data-i="${btn.dataset.i}"]`);
        const it = addTodoItem(wrap, "", 0);
        layoutTodo(wrap); it.querySelector(".ttext").focus(); refreshOut();
      });
    });
  }
  function setTg(el,on){
    el.classList.toggle("off",!on);
    el.textContent = el.dataset.label;   // 꺼짐 상태는 CSS로 회색/인쇄시 투명
    if (el.dataset.k === "s") updateSpo2(el.dataset.i);   // S ↔ V/S SpO2 괄호 연동
  }
  // S 토글이 켜져 있으면 V/S 칸 끝에 (SpO2) 괄호를 보이게
  function updateSpo2(i){
    const s  = document.querySelector(`[data-i="${i}"][data-k="s"]`);
    const vs = document.querySelector(`[data-i="${i}"][data-k="vs"]`);
    if (!s || !vs) return;
    vs.classList.toggle("son", !s.classList.contains("off"));
  }

  /* ── 할 일 리스트 (메모 7칸 병합, 3열 우측→좌측 채움) ──── */
  // 한 항목 = [완료 괄호][편집 텍스트]. wrap._items 가 순서의 진실원.
  function makeChk(done){
    const c = document.createElement("span");
    c.className = "tchk" + (done ? " on" : "");
    c.innerHTML = done ? "(+)" : "(&nbsp;)";
    c.addEventListener("click", () => {
      const on = !c.classList.contains("on");
      c.classList.toggle("on", on); c.innerHTML = on ? "(+)" : "(&nbsp;)";
      refreshOut();
    });
    return c;
  }
  function addTodoItem(wrap, html, done){
    const it = document.createElement("div"); it.className = "todoitem";
    const chk = makeChk(done);
    const tx = document.createElement("span");
    tx.className = "ttext"; tx.contentEditable = "true"; if (html) tx.innerHTML = html;
    tx.addEventListener("input", () => { layoutTodo(wrap); refreshOut(); });   // 길어지면 재배치(커서 보존)
    tx.addEventListener("contextmenu", onCtx);
    tx.addEventListener("keydown", ev => {
      if (ev.key === "Enter"){ ev.preventDefault();
        const nit = addTodoItem(wrap, "", 0); layoutTodo(wrap); nit.querySelector(".ttext").focus(); refreshOut();
      }
    });
    tx.addEventListener("blur", () => {           // 빈 줄은 포커스 벗어나면 삭제
      if (!tx.textContent.trim()){
        const idx = wrap._items.indexOf(it); if (idx >= 0) wrap._items.splice(idx,1);
        it.remove(); layoutTodo(wrap); refreshOut();
      }
    });
    it.appendChild(tx); it.appendChild(chk);   // 글씨(우측정렬) → 괄호(오른쪽)
    wrap._items = wrap._items || []; wrap._items.push(it);
    return it;
  }
  // 3열을 우측(tcR, 3칸 높이)→가운데(tcM)→왼쪽(tcL, 2칸 높이) 순으로 채우고,
  // 다 넘치면 글씨 크기를 줄여 더 많은 줄이 들어가게
  // 재배치는 항목을 열 사이로 옮기므로(=DOM 재부착) 편집 중 커서가 날아감 → 저장/복원
  function saveCaret(wrap){
    const sel = window.getSelection();
    if (!sel || !sel.rangeCount) return null;
    const n = sel.anchorNode;
    const tt = n && (n.nodeType === 3 ? n.parentElement : n);
    const ttext = tt && tt.closest && tt.closest(".ttext");
    if (!ttext || !wrap.contains(ttext)) return null;
    const r = document.createRange();
    r.selectNodeContents(ttext); r.setEnd(sel.anchorNode, sel.anchorOffset);
    return { ttext, offset: r.toString().length };
  }
  function restoreCaret(s){
    if (!s || !s.ttext.isConnected) return;
    s.ttext.focus();
    const walker = document.createTreeWalker(s.ttext, NodeFilter.SHOW_TEXT);
    let acc = 0, tn, target = null, off = 0;
    while ((tn = walker.nextNode())){
      if (acc + tn.length >= s.offset){ target = tn; off = s.offset - acc; break; }
      acc += tn.length;
    }
    const range = document.createRange();
    if (target){ range.setStart(target, off); range.collapse(true); }
    else { range.selectNodeContents(s.ttext); range.collapse(false); }
    const sel = window.getSelection(); sel.removeAllRanges(); sel.addRange(range);
  }

  function layoutTodo(wrap){
    if (!wrap) return;
    const caret = saveCaret(wrap);
    const cell = wrap.closest("td"); if (!cell) return;
    const W = cell.clientWidth, H = cell.clientHeight, gap = 4;   // td 퍼센트 높이가 불안정 → 셀 기준
    wrap.style.height = H + "px"; wrap.style.width = W + "px";
    const colW = (W - 2*gap) / 3, rowH = H / 3;
    const tcL = wrap.querySelector(".tcL"), tcM = wrap.querySelector(".tcM"), tcR = wrap.querySelector(".tcR");
    tcL.style.height = tcM.style.height = (H - rowH) + "px";     // 왼쪽 두 열은 2칸 높이
    tcR.style.height = H + "px";                                 // 오른쪽 열은 3칸 높이
    const vs = wrap.querySelector(".vs");
    if (vs){ vs.style.width = (2*colW + gap) + "px"; vs.style.height = rowH + "px"; }
    const order = [tcR, tcM, tcL];                               // 채우는 순서(우→좌)
    const items = wrap._items || [];
    const setFont = f => order.forEach(c => c.style.fontSize = f + "pt");
    const setWrap = on => {
      wrap.classList.toggle("wrapmode", on);
      items.forEach(it => it.querySelector(".ttext").style.whiteSpace = on ? "normal" : "nowrap");
    };
    // 3열에 우→좌로 채우기 (세로로 다 들어가면 true)
    const place = () => {
      order.forEach(c => c.innerHTML = "");
      let ci = 0;
      for (const it of items){
        while (ci < order.length){
          order[ci].appendChild(it);
          if (order[ci].scrollHeight <= order[ci].clientHeight + 1) break;
          order[ci].removeChild(it); ci++;
        }
        if (ci >= order.length) return false;
      }
      return true;
    };
    // 한 줄인데 가로로 잘리는 항목이 있나
    const clipped = () => items.some(it => { const t = it.querySelector(".ttext"); return t.scrollWidth > t.clientWidth + 1; });

    const doFit = () => {
      // ① 한 줄 유지: 폰트를 줄여 잘림+세로넘침 없게 (8.5 → 6pt)
      setWrap(false);
      for (let fs = 8.5; fs >= 6; fs -= 0.5){ setFont(fs); if (place() && !clipped()) return; }
      // 6pt에서 세로는 되는데(=자리 있음) 가로로 잘리면 → ② 줄바꿈 + 줄간격 넓게 (7 → 5pt)
      setFont(6);
      if (place()){
        setWrap(true);
        for (let fs = 7; fs >= 5; fs -= 0.5){ setFont(fs); if (place()) return; }
        return;
      }
      // 세로 자체가 넘침(항목 많음) → 한 줄 유지한 채 더 축소 (6 → 4.5pt)
      setWrap(false);
      for (let fs = 6; fs >= 4.5; fs -= 0.5){ setFont(fs); if (place()) return; }
    };
    doFit();
    restoreCaret(caret);
  }
  function layoutAllTodo(){ document.querySelectorAll(".todowrap").forEach(layoutTodo); }

  /* ── 상태 수집 / 적용 (DOM이 단일 진실원) ─────────────── */
  function collect(){
    const out = [];
    for (let i=0;i<count;i++){
      const o = {};
      KEYS.forEach(k => {
        const el = document.querySelector(`[data-i="${i}"][data-k="${k}"]`);
        if (!el) return;
        if (el.classList.contains("tg")) { if (!el.classList.contains("off")) o[k] = 1; }
        else if (el.classList.contains("todowrap")) {
          const items = (el._items || [])
            .filter(it => it.querySelector(".ttext").textContent.trim())
            .map(it => {
              const rec = { t: it.querySelector(".ttext").innerHTML };
              if (it.querySelector(".tchk").classList.contains("on")) rec.c = 1;
              return rec;
            });
          if (items.length) o[k] = items;
        }
        else if (el.value) o[k] = el.value;
      });
      out.push(o);
    }
    return out;
  }
  function apply(list, silent){
    if (!silent){
      const need = Math.min(MAX, Math.max(1, list.length));
      if (need !== count){ count = need; render(false); }
    }
    for (let i=0;i<count;i++){
      const o = list[i] || {};
      KEYS.forEach(k => {
        const el = document.querySelector(`[data-i="${i}"][data-k="${k}"]`);
        if (!el) return;
        if (el.classList.contains("tg")) setTg(el, !!o[k]);
        else if (el.classList.contains("todowrap")) {
          el._items = [];
          el.querySelectorAll(".todocol").forEach(c => c.innerHTML = "");
          (Array.isArray(o[k]) ? o[k] : []).forEach(x => {
            const t = (typeof x === "string") ? x : (x && x.t) || "";
            const c = (x && typeof x === "object" && x.c) ? 1 : 0;
            addTodoItem(el, t, c);
          });
          layoutTodo(el);
        }
        else el.value = o[k] || "";
      });
    }
  }
  function isEmpty(){
    return collect().every(o => Object.keys(o).length === 0);
  }

  /* ── 연동: XOR(고정키) → base64, 접두사 HND1: ─────────── */
  const XKEY = "handoff-sheet-sync-key";
  function xorBytes(bytes){
    const k = new TextEncoder().encode(XKEY);
    const out = new Uint8Array(bytes.length);
    for (let i=0;i<bytes.length;i++) out[i] = bytes[i] ^ k[i % k.length];
    return out;
  }
  function encode(str){
    const b = xorBytes(new TextEncoder().encode(str));
    let bin = ""; b.forEach(x => bin += String.fromCharCode(x));
    return "HND1:" + btoa(bin);
  }
  function decode(code){
    code = (code||"").trim();
    if (!code.startsWith("HND1:")) return code;         // 평문 JSON도 하위호환
    const bin = atob(code.slice(5));
    const bytes = xorBytes(Uint8Array.from(bin, c => c.charCodeAt(0)));
    return new TextDecoder().decode(bytes);
  }
  function exportStr(){ return JSON.stringify({ v:1, n:count, p:collect() }); }
  function flash(btn, text){ const o = btn.textContent; btn.textContent = text; setTimeout(()=>btn.textContent=o,1200); }

  function applyStr(raw){
    const str = decode((raw||"").trim());
    if (!str){ alert("불러올 코드나 파일이 없어요."); return; }
    let data; try { data = JSON.parse(str); } catch { alert("코드 형식이 올바르지 않아요."); return; }
    const list = Array.isArray(data.p) ? data.p : (Array.isArray(data) ? data : null);
    if (!list){ alert("인계장 데이터를 찾을 수 없어요."); return; }
    const filled = list.filter(o => o && Object.keys(o).length).length;
    if (!confirm(`지금 화면을 불러온 데이터(${filled}명 기재)로 덮어쓸까요?`)) return;
    count = Math.min(MAX, Math.max(1, data.n || list.length || MAX));
    render(false);
    apply(list, true);
    $("#syncpanel").classList.remove("open");
    alert("적용됐어요.");
  }

  /* ── 툴바 ─────────────────────────────────────────────── */
  $("#plus").addEventListener("click", () => { if (count<MAX){ count++; render(true);} });
  $("#minus").addEventListener("click", () => {
    if (count<=1) return;
    const last = collect()[count-1];
    if (Object.keys(last).length && !confirm("마지막 줄에 적힌 내용이 지워져요. 계속할까요?")) return;
    count--; render(true);
  });
  $("#printBtn").addEventListener("click", () => window.print());
  $("#clearBtn").addEventListener("click", () => {
    if (isEmpty() || confirm("전체 내용을 지울까요? 되돌릴 수 없어요.")) render(false);
  });

  $("#syncBtn").addEventListener("click", () => {
    const p = $("#syncpanel");
    if (p.classList.contains("open")){ p.classList.remove("open"); return; }
    $("#sync-out").value = encode(exportStr());
    $("#sync-in").value = "";
    p.classList.add("open");
  });
  $("#syncCopy").addEventListener("click", async () => {
    const el = $("#sync-out");
    try { await navigator.clipboard.writeText(el.value); }
    catch { el.select(); document.execCommand("copy"); }
    flash($("#syncCopy"), "복사됨!");
  });
  $("#syncSave").addEventListener("click", () => {
    const blob = new Blob([encode(exportStr())], { type:"text/plain" });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "handoff-" + new Date().toISOString().slice(0,10) + ".txt";
    a.click();
    setTimeout(()=>URL.revokeObjectURL(a.href),1000);
  });
  $("#syncApply").addEventListener("click", () => applyStr($("#sync-in").value));
  $("#syncOpen").addEventListener("click", () => $("#syncFile").click());
  $("#syncFile").addEventListener("change", e => {
    const f = e.target.files[0]; if (!f) return;
    const rd = new FileReader();
    rd.onload = () => applyStr(rd.result);
    rd.readAsText(f);
    e.target.value = "";
  });

  /* ── 폰에서 가로폭 맞추기 (인쇄엔 영향 없음) ──────────── */
  function scaleToFit(){
    const sheet = $("#sheet");
    sheet.style.transform = "none";
    sheet.style.marginBottom = "";
    const avail = document.querySelector(".stage").clientWidth - 4;
    const w = sheet.offsetWidth;
    if (w > avail){
      const s = avail / w;
      sheet.style.transform = `scale(${s})`;
      sheet.style.marginBottom = (sheet.offsetHeight*(s-1)) + "px";
    }
  }
  window.addEventListener("resize", scaleToFit);
  $("#rows").addEventListener("input", refreshOut);

  /* ── 우클릭 서식 메뉴 (오른쪽 칸 리치텍스트) ──────────── */
  let menuEl = null, ctxTarget = null, ctxRange = null;
  function getMenu(){
    if (menuEl) return menuEl;
    const m = document.createElement("div");
    m.className = "ctxmenu no-print";
    m.innerHTML =
      `<div class="cm-row cm-colors">
         <button data-act="fore" data-v="#000000" style="color:#000" title="검정">가</button>
         <button data-act="fore" data-v="#dc2626" style="color:#dc2626" title="빨강">가</button>
         <button data-act="fore" data-v="#2563eb" style="color:#2563eb" title="파랑">가</button>
         <button data-act="fore" data-v="#16a34a" style="color:#16a34a" title="초록">가</button>
         <button data-act="fore" data-v="#7c3aed" style="color:#7c3aed" title="보라">가</button>
       </div>
       <div class="cm-row cm-hl">
         <button data-act="hl" data-v="#fde047" style="background:#fde047" title="노랑">&nbsp;</button>
         <button data-act="hl" data-v="#bef264" style="background:#bef264" title="연두">&nbsp;</button>
         <button data-act="hl" data-v="#7dd3fc" style="background:#7dd3fc" title="하늘">&nbsp;</button>
         <button data-act="hl" data-v="transparent" title="형광펜 지우기">✕</button>
       </div>
       <div class="cm-row">
         <button data-act="bold" title="볼드"><b>B</b> 볼드</button>
         <button data-act="clear" title="서식 지우기">서식지우기</button>
       </div>`;
    document.body.appendChild(m);
    // 메뉴를 누를 때 편집칸의 선택영역/포커스가 풀리지 않게
    m.addEventListener("mousedown", ev => ev.preventDefault());
    m.addEventListener("click", ev => {
      const b = ev.target.closest("button"); if (!b) return;
      applyFmt(b.dataset.act, b.dataset.v);
      m.classList.remove("open");
    });
    menuEl = m;
    return m;
  }
  function onCtx(e){
    e.preventDefault();
    ctxTarget = e.currentTarget;
    const sel = window.getSelection();
    ctxRange = (sel && sel.rangeCount && ctxTarget.contains(sel.anchorNode))
      ? sel.getRangeAt(0).cloneRange() : null;
    const m = getMenu();
    m.classList.add("open");
    const mw = m.offsetWidth || 180, mh = m.offsetHeight || 130;
    m.style.left = Math.max(4, Math.min(e.clientX, window.innerWidth  - mw - 4)) + "px";
    m.style.top  = Math.max(4, Math.min(e.clientY, window.innerHeight - mh - 4)) + "px";
  }
  function applyFmt(act, v){
    const t = ctxTarget; if (!t) return;
    t.focus();
    const sel = window.getSelection();
    sel.removeAllRanges();
    let range;
    if (ctxRange && !ctxRange.collapsed){ range = ctxRange; }
    else { range = document.createRange(); range.selectNodeContents(t); }  // 선택 없으면 칸 전체
    sel.addRange(range);
    try { document.execCommand("styleWithCSS", false, true); } catch(_){}
    if      (act === "fore") document.execCommand("foreColor",  false, v);
    else if (act === "hl")   document.execCommand("hiliteColor", false, v);
    else if (act === "bold") document.execCommand("bold");
    else if (act === "clear"){ document.execCommand("removeFormat"); document.execCommand("hiliteColor", false, "transparent"); }
    const wrap = t.closest(".todowrap"); if (wrap) layoutTodo(wrap);
    refreshOut();
  }
  document.addEventListener("click", e => {
    if (menuEl && menuEl.classList.contains("open") && !menuEl.contains(e.target)) menuEl.classList.remove("open");
  });
  document.addEventListener("keydown", e => { if (e.key === "Escape" && menuEl) menuEl.classList.remove("open"); });
  window.addEventListener("scroll", () => { if (menuEl) menuEl.classList.remove("open"); }, true);

  /* ── 실수로 닫기 방지 (저장은 안 함) ──────────────────── */
  window.addEventListener("beforeunload", e => {
    if (!isEmpty()){ e.preventDefault(); e.returnValue = ""; }
  });

  render(false);

  if ("serviceWorker" in navigator)
    window.addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(()=>{}));
})();
</script>
</body>
</html>
